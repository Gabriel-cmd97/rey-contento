<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rey Contento - Multijugador</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin-top: 30px; background-color: #f4f4f9; }
        button { padding: 15px 30px; font-size: 18px; cursor: pointer; background-color: #2c3e50; color: white; border: none; border-radius: 5px; margin: 5px;}
        button:disabled { background-color: #95a5a6 !important; cursor: not-allowed; opacity: 0.6; }
        #consola { margin-top: 20px; color: #e74c3c; font-weight: bold; font-size: 20px; }
        .rey-alerta { background-color: #f1c40f; color: #d35400; padding: 10px; font-weight: bold; border-radius: 5px; border: 2px dashed #d35400; margin: 10px 0;}
        
        /* Diseño del Panel de Reglas */
        #panelConfiguracion { background: #fff; border: 1px solid #bdc3c7; border-radius: 8px; padding: 20px; display: inline-block; text-align: left; margin-bottom: 20px; box-shadow: 0px 4px 6px rgba(0,0,0,0.1); }
        .opcion-config { margin-bottom: 12px; }
        .opcion-config label { font-weight: bold; display: block; margin-bottom: 5px; }
        .opcion-config select { width: 100%; padding: 8px; border-radius: 4px; border: 1px solid #7f8c8d; }

        /* Diseño de la Carta Real */
        .carta-naipe { font-size: 80px; font-weight: bold; padding: 30px 20px; background-color: white; border: 2px solid #bdc3c7; border-radius: 15px; display: inline-block; min-width: 140px; min-height: 200px; box-shadow: 5px 5px 15px rgba(0,0,0,0.2); transition: transform 0.3s; color: #2c3e50; }
        .carta-naipe:hover { transform: translateY(-10px); }
        .carta-nombre { font-size: 18px; display: block; margin-top: 15px; color: #7f8c8d; }
        .carta-0 { border: 4px solid #c0392b; color: #c0392b; background-color: #fadbd8; }
        .carta-9 { border: 4px solid #f39c12; color: #d35400; background-color: #fef9e7; }
    </style>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
</head>
<body>

    <h1 style="margin: 0;">👑 Rey Contento</h1>
    <p>Estado del servidor: <span id="estado" style="color: red;">Desconectado</span></p>
    
    <div id="panelConfiguracion">
        <h3 style="margin-top: 0; text-align: center;">⚙️ Reglas de la Casa</h3>
        
        <div class="opcion-config">
            <label>Modo del 9 (El Rey):</label>
            <select id="selectModo">
                <option value="SORPRESA">Sorpresa (Bloqueo en secreto)</option>
                <option value="DECLARADO">Declarado (Rey a la vista)</option>
            </select>
        </div>

        <div class="opcion-config">
            <label>Frecuencia de 9s (Caos):</label>
            <select id="selectReyes">
                <option value="NORMAL">Normal (1 en el mazo)</option>
                <option value="ALTA">Alta (2 en el mazo)</option>
                <option value="LOCURA">Locura (3 en el mazo)</option>
            </select>
        </div>

        <div class="opcion-config">
            <label>Vidas Iniciales:</label>
            <select id="selectVidas">
                <option value="1">1 Vida (Muerte súbita)</option>
                <option value="3" selected>3 Vidas</option>
                <option value="5">5 Vidas</option>
            </select>
        </div>

        <div class="opcion-config">
            <label>Máximo de Jugadores:</label>
            <select id="selectJugadores">
                <option value="2">2 Jugadores</option>
                <option value="4" selected>4 Jugadores</option>
                <option value="8">8 Jugadores</option>
            </select>
        </div>

        <div style="text-align: center; margin-top: 15px;">
            <button id="btnCrearSala" disabled>Crear Partida</button>
        </div>
    </div>
    
    <div id="panelUnirse" style="margin-top: 10px;">
        <input type="text" id="inputCodigo" placeholder="Código de la sala" style="padding: 10px; font-size: 16px;">
        <button id="btnUnirseSala">Unirse a Partida</button>
    </div>

    <div id="consola"></div>

    <div style="margin-top: 30px;">
        <h3>Jugadores en la sala:</h3>
        <ul id="listaJugadores" style="list-style: none; padding: 0;"></ul>
    </div>
    
    <div style="margin-top: 20px;">
        <button id="btnEmpezar" style="background-color: #27ae60; display: none;">¡Empezar Juego!</button>
    </div>

    <div id="mesaDeJuego" style="display: none; margin-top: 40px; padding: 20px; border: 2px solid #2c3e50; border-radius: 10px;">
        <h2>🃏 Tu Carta:</h2>
        
        <div id="miCarta" class="carta-naipe">
            <span id="numeroCarta">?</span><br>
            <span id="nombrePersonaje" class="carta-nombre">Esperando...</span>
        </div>
        
        <h3 id="mensajeTurno" style="color: #2980b9; margin-top: 20px;">Esperando que empiece el juego...</h3>
        
        <div style="margin-top: 20px;">
            <button id="btnMantener" disabled style="background-color: #f39c12;">Mantener</button>
            <button id="btnCambiar" disabled style="background-color: #c0392b;">Cambiar</button>
        </div>
        
        <div id="historialJuego" style="margin-top: 30px; text-align: left; background: #fff; padding: 15px; border-radius: 5px; min-height: 100px;">
            <h4>📜 Historial del Reino:</h4>
        </div>

        <div style="margin-top: 20px;">
            <button id="btnSiguienteRonda" style="background-color: #3498db; display: none;">Siguiente Ronda ➡️</button>
        </div>
    </div>

    <script>
        const socket = io('http://34.204.215.13:3000');

        const estadoTxt = document.getElementById('estado');
        const btnCrear = document.getElementById('btnCrearSala');
        const consola = document.getElementById('consola');
        const btnUnirse = document.getElementById('btnUnirseSala');
        const inputCodigo = document.getElementById('inputCodigo');
        const listaJugadores = document.getElementById('listaJugadores');
        
        const btnEmpezar = document.getElementById('btnEmpezar');
        const mesaDeJuego = document.getElementById('mesaDeJuego');
        const mensajeTurno = document.getElementById('mensajeTurno');
        const btnMantener = document.getElementById('btnMantener');
        const btnCambiar = document.getElementById('btnCambiar');
        const historialJuego = document.getElementById('historialJuego');
        const btnSiguienteRonda = document.getElementById('btnSiguienteRonda');

        let miSalaActual = "";
        let soyElHost = false;

        const nombresCartas = {
            0: "🧦 El Mendigo", 1: "🐀 La Rata", 2: "🧑‍🌾 El Campesino", 3: "🪕 El Trovador",
            4: "🛡️ El Guardia", 5: "🪓 El Verdugo", 6: "💃 La Duquesa", 7: "🧙‍♂️ El Mago",
            8: "⚔️ El General", 9: "👑 El Rey Contento"
        };

        socket.on('connect', () => {
            estadoTxt.innerText = "Conectado 🟢"; estadoTxt.style.color = "green"; btnCrear.disabled = false;
        });

        // 🛠️ MODIFICADO: Enviamos todas las opciones al crear
        btnCrear.addEventListener('click', () => { 
            const configuracion = {
                modoRey: document.getElementById('selectModo').value,
                frecuenciaReyes: document.getElementById('selectReyes').value,
                vidas: parseInt(document.getElementById('selectVidas').value),
                maxJugadores: parseInt(document.getElementById('selectJugadores').value)
            };
            socket.emit('crearSala', configuracion); 
        });

        socket.on('salaCreada', (idSala) => {
            miSalaActual = idSala;
            soyElHost = true;
            consola.innerText = `¡Sala creada! Código: ${idSala}`;
            btnEmpezar.style.display = "inline-block"; 
            
            // Congelamos el panel de configuración para no hacer trampa a medio camino
            document.getElementById('selectModo').disabled = true;
            document.getElementById('selectReyes').disabled = true;
            document.getElementById('selectVidas').disabled = true;
            document.getElementById('selectJugadores').disabled = true;
            btnCrear.disabled = true;
        });

        socket.on('disconnect', () => {
            estadoTxt.innerText = "Desconectado 🔴"; estadoTxt.style.color = "red"; btnCrear.disabled = true;
        });
        
        btnUnirse.addEventListener('click', () => {
            const codigo = inputCodigo.value;
            if (codigo !== "") {
                miSalaActual = codigo.toUpperCase();
                socket.emit('unirseSala', miSalaActual);
            }
        });

        socket.on('actualizarLobby', (jugadores) => {
            listaJugadores.innerHTML = '';
            jugadores.forEach((jugador, index) => {
                const li = document.createElement('li');
                li.innerText = `${index === 0 ? '👑' : '👤'} Jugador: ${jugador.id.substring(0,5)}... (Vidas: ${jugador.vidas})`;
                listaJugadores.appendChild(li);
            });
        });
        
        btnEmpezar.addEventListener('click', () => { 
            document.getElementById('panelConfiguracion').style.display = 'none'; // Ocultamos reglas para hacer espacio
            socket.emit('iniciarPartida', miSalaActual); 
        });

        socket.on('tuCarta', (carta) => {
            const numeroCartaUI = document.getElementById('numeroCarta');
            const nombrePersonajeUI = document.getElementById('nombrePersonaje');
            const miCartaContenedor = document.getElementById('miCarta');

            numeroCartaUI.innerText = carta; 
            nombrePersonajeUI.innerText = nombresCartas[carta];
            miCartaContenedor.className = "carta-naipe"; 

            if (carta === 0) miCartaContenedor.classList.add('carta-0');
            if (carta === 9) miCartaContenedor.classList.add('carta-9');

            mesaDeJuego.style.display = "block"; 
            btnEmpezar.style.display = "none"; 
        });

        socket.on('reyRevelado', (idJugadorConRey) => {
            const div = document.createElement('div');
            div.className = "rey-alerta";
            div.innerHTML = `👑 <b>¡ATENCIÓN!</b> El jugador ${idJugadorConRey.substring(0,5)} tiene al Rey (9).`;
            historialJuego.appendChild(div);
        });

        socket.on('juegoIniciado', (idJugadorEnTurno) => {
            mesaDeJuego.style.display = "block";
            
            if (socket.id === idJugadorEnTurno) {
                mensajeTurno.innerText = "¡ES TU TURNO! ¿Qué decides?";
                mensajeTurno.style.color = "#c0392b";
                btnMantener.disabled = false;
                btnCambiar.disabled = false;
            } else {
                mensajeTurno.innerText = "Turno del rival... esperando.";
                mensajeTurno.style.color = "#7f8c8d";
                btnMantener.disabled = true;
                btnCambiar.disabled = true;
            }
        });

        btnMantener.addEventListener('click', () => {
            socket.emit('accionJugador', { idSala: miSalaActual, accion: 'MANTENER' });
            btnMantener.disabled = true; btnCambiar.disabled = true;
        });

        btnCambiar.addEventListener('click', () => {
            socket.emit('accionJugador', { idSala: miSalaActual, accion: 'CAMBIAR' });
            btnMantener.disabled = true; btnCambiar.disabled = true;
        });

        socket.on('cambioDeTurno', (idJugadorEnTurno) => {
            if (socket.id === idJugadorEnTurno) {
                mensajeTurno.innerText = "¡ES TU TURNO! ¿Qué decides?";
                mensajeTurno.style.color = "#c0392b";
                btnMantener.disabled = false;
                btnCambiar.disabled = false;
            } else {
                mensajeTurno.innerText = "Turno del rival... esperando.";
                mensajeTurno.style.color = "#7f8c8d";
            }
        });

        socket.on('mensajeGlobal', (mensaje) => {
            const p = document.createElement('p');
            if (mensaje.includes("BLOQUEO REAL") || mensaje.includes("saltado")) {
                p.style.color = "#c0392b"; p.style.fontWeight = "bold";
            }
            if (mensaje.includes("👑")) p.style.color = "#f39c12";
            
            p.innerText = mensaje;
            historialJuego.appendChild(p);
        });

        socket.on('rondaTerminada', (datos) => {
            mensajeTurno.innerText = "¡LA RONDA HA TERMINADO!";
            mensajeTurno.style.color = "#8e44ad";
            btnMantener.disabled = true;
            btnCambiar.disabled = true;

            let resultadoHTML = `<strong>La carta mortal fue el: ${datos.cartaMortal}</strong><br><br>`;
            
            datos.jugadores.forEach(j => {
                let status = datos.perdedores.includes(j.id) ? "💔 Perdió vida" : "✅ Salvado";
                let yo = j.id === socket.id ? "(Tú)" : "";
                resultadoHTML += `Jugador ${j.id.substring(0,5)} ${yo} tenía <b>${j.cartaActual}</b> -> ${status}<br>`;
            });

            const divRes = document.createElement('div');
            divRes.style.marginTop = "20px";
            divRes.style.padding = "10px";
            divRes.style.backgroundColor = "#ecf0f1";
            divRes.innerHTML = resultadoHTML;
            historialJuego.appendChild(divRes);

            if (soyElHost) btnSiguienteRonda.style.display = "inline-block";
        });

        btnSiguienteRonda.addEventListener('click', () => {
            socket.emit('siguienteRonda', miSalaActual);
            btnSiguienteRonda.style.display = "none";
        });

        socket.on('nuevaRondaIniciada', (datos) => {
            historialJuego.innerHTML = "<h4>📜 Historial del Reino:</h4>";
            btnSiguienteRonda.style.display = "none";

            if (socket.id === datos.turno) {
                mensajeTurno.innerText = "¡NUEVA RONDA! ES TU TURNO.";
                mensajeTurno.style.color = "#c0392b";
                btnMantener.disabled = false;
                btnCambiar.disabled = false;
            } else {
                mensajeTurno.innerText = "Turno del rival... esperando.";
                mensajeTurno.style.color = "#7f8c8d";
                btnMantener.disabled = true;
                btnCambiar.disabled = true;
            }

            listaJugadores.innerHTML = '';
            datos.jugadoresActualizados.forEach((jugador, index) => {
                const li = document.createElement('li');
                li.innerText = `${index === 0 ? '👑' : '👤'} Jugador: ${jugador.id.substring(0,5)}... (Vidas: ${jugador.vidas})`;
                listaJugadores.appendChild(li);
            });
        });

        socket.on('finDelJuego', (ganador) => {
            mesaDeJuego.innerHTML = `
                <h1 style="font-size: 80px; margin: 0;">👑</h1>
                <h1 style="color: #f1c40f;">¡TENEMOS UN REY CONTENTO!</h1>
                <h2>Ganador: Jugador ${ganador.id.substring(0,5)}...</h2>
                <p>Sobrevivió con ${ganador.vidas} vidas.</p>
                <button onclick="location.reload()" style="background-color: #2ecc71; margin-top: 20px;">Volver al Inicio</button>
            `;
        });

        socket.on('errorSala', (mensaje) => { alert(mensaje); });
    </script>
</body>
</html>
