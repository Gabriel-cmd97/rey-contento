<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="bgFantasmaWraith" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#0a2a3a"/>
      <stop offset="55%" stop-color="#05151e"/>
      <stop offset="100%" stop-color="#01070b"/>
    </radialGradient>
    <linearGradient id="ectoplasmaManto" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e0f7fa"/>
      <stop offset="30%" stop-color="#67e8f9"/>
      <stop offset="65%" stop-color="#0891b2"/>
      <stop offset="100%" stop-color="#083344"/>
    </linearGradient>
    <radialGradient id="fuegoAlmaCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#a5f3fc"/>
      <stop offset="70%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0e7490" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="coronaEspectralFlotante" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#cffafe"/>
      <stop offset="50%" stop-color="#67e8f9"/>
      <stop offset="100%" stop-color="#0e7490"/>
    </linearGradient>
  </defs>

  <!-- Fondo de páramo espectral nocturno -->
  <circle cx="32" cy="32" r="32" fill="url(#bgFantasmaWraith)"/>

  <!-- Halo de ectoplasma palpitante -->
  <circle cx="32" cy="28" r="24" fill="#06b6d4" opacity="0.15">
    <animate attributeName="opacity" values="0.1;0.25;0.1" dur="2.6s" repeatCount="indefinite"/>
    <animate attributeName="r" values="22;26;22" dur="2.6s" repeatCount="indefinite"/>
  </circle>

  <!-- Orbes de almas y fuegos fatuos ascendiendo -->
  <circle cx="12" cy="34" r="1.1" fill="#a5f3fc" opacity="0.85">
    <animate attributeName="cy" values="34;14;34" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="52" cy="30" r="0.9" fill="#cffafe" opacity="0.8">
    <animate attributeName="cy" values="30;12;30" dur="2.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="18" cy="18" r="0.7" fill="#67e8f9" opacity="0.75"/>
  <circle cx="48" cy="46" r="0.8" fill="#22d3ee" opacity="0.6"/>

  <!-- Manto de harapos fantasmales vaporosos que se disuelven en la nada -->
  <path d="M12 64 C12 50, 16 43, 24 41 L32 46 L40 41 C48 43, 52 50, 52 64 L47 58 L42 64 L37 57 L32 64 L27 57 L22 64 L17 58 Z" fill="url(#ectoplasmaManto)" opacity="0.85"/>
  <path d="M16 64 C16 54, 21 47, 28 45 L32 49 L36 45 C43 47, 48 54, 48 64 Z" fill="#083344" opacity="0.6"/>

  <!-- Gran Capucha espectral tejida con niebla funeraria -->
  <path d="M16 33 C16 15, 22 9, 32 9 C42 9, 48 15, 48 33 C48 44, 43 49, 39 50 C37 44, 38 38, 37 32 C36 22, 35 15, 32 15 C29 15, 28 22, 27 32 C26 38, 27 44, 25 50 C21 49, 16 44, 16 33 Z" fill="url(#ectoplasmaManto)" stroke="#0e7490" stroke-width="0.7"/>

  <!-- Vacío abisal de la capucha (Oscuridad profunda donde mora el espectro) -->
  <path d="M20 31 C20 17, 24 14, 32 14 C40 14, 44 17, 44 31 C44 41, 40 46, 32 48 C24 46, 20 41, 20 31 Z" fill="#02080d"/>

  <!-- Silueta cadavérica traslúcida que se asoma débilmente -->
  <path d="M23 28 C23 22, 26 19, 32 19 C38 19, 41 22, 41 28 C41 35, 38 41, 32 43 C26 41, 23 35, 23 28 Z" fill="#67e8f9" opacity="0.25"/>

  <!-- Cuencas de sombra pura -->
  <ellipse cx="27" cy="27" rx="3.2" ry="2.6" fill="#010508"/>
  <ellipse cx="37" cy="27" rx="3.2" ry="2.6" fill="#010508"/>

  <!-- Ojos de Fuego de Alma resplandeciente (Llamas celestes vivas) -->
  <circle cx="27" cy="27" r="3.2" fill="url(#fuegoAlmaCyan)">
    <animate attributeName="r" values="2.6;3.6;2.6" dur="1.7s" repeatCount="indefinite"/>
  </circle>
  <circle cx="27" cy="27" r="1.1" fill="#ffffff">
    <animate attributeName="opacity" values="0.7;1;0.7" dur="1.7s" repeatCount="indefinite"/>
  </circle>

  <circle cx="37" cy="27" r="3.2" fill="url(#fuegoAlmaCyan)">
    <animate attributeName="r" values="3.6;2.6;3.6" dur="1.7s" repeatCount="indefinite"/>
  </circle>
  <circle cx="37" cy="27" r="1.1" fill="#ffffff">
    <animate attributeName="opacity" values="1;0.7;1" dur="1.7s" repeatCount="indefinite"/>
  </circle>

  <!-- Lamento espectral (Boca vaporosa suspendida) -->
  <path d="M29 36 Q32 34 35 36 Q34 41 32 42 Q30 41 29 36 Z" fill="#010508"/>

  <!-- Corona espectral rota flotando sobre el sudario con levitación mística -->
  <g>
    <path d="M19 13 L22 5 L26 10 L32 2 L38 10 L42 5 L45 13 L43 16 L21 16 Z" fill="url(#coronaEspectralFlotante)" stroke="#cffafe" stroke-width="0.6" opacity="0.9">
      <animate attributeName="transform" type="translate" values="0,0; 0,-1.5; 0,0" dur="2.2s" repeatCount="indefinite"/>
    </path>
    <!-- Gema espectral en el pico central -->
    <circle cx="32" cy="8" r="1.5" fill="#a5f3fc" stroke="#ffffff" stroke-width="0.4"/>
  </g>
</svg>
