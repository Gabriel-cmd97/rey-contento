<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="bgFantasma" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#0a2a3a"/>
      <stop offset="55%" stop-color="#05151e"/>
      <stop offset="100%" stop-color="#02080c"/>
    </radialGradient>
    <linearGradient id="mantoEspectral" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e0f7fa"/>
      <stop offset="35%" stop-color="#80deea"/>
      <stop offset="70%" stop-color="#00838f"/>
      <stop offset="100%" stop-color="#004d40"/>
    </linearGradient>
    <radialGradient id="fuegoAlma" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#84ffff"/>
      <stop offset="75%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#0091ea"/>
    </radialGradient>
    <linearGradient id="coronaEspectral" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e0f2f1"/>
      <stop offset="50%" stop-color="#80cbc4"/>
      <stop offset="100%" stop-color="#004d40"/>
    </linearGradient>
  </defs>

  <!-- Fondo de páramo espectral -->
  <circle cx="32" cy="32" r="32" fill="url(#bgFantasma)"/>

  <!-- Halo de ectoplasma y condensación de almas -->
  <circle cx="32" cy="30" r="24" fill="#00e5ff" opacity="0.12">
    <animate attributeName="opacity" values="0.08;0.22;0.08" dur="2.5s" repeatCount="indefinite"/>
    <animate attributeName="r" values="22;26;22" dur="2.5s" repeatCount="indefinite"/>
  </circle>

  <!-- Fuego fatuo y orbes de alma ascendiendo -->
  <circle cx="14" cy="36" r="1.1" fill="#84ffff" opacity="0.8">
    <animate attributeName="cy" values="36;16;36" dur="2.7s" repeatCount="indefinite"/>
  </circle>
  <circle cx="50" cy="32" r="0.9" fill="#e0f7fa" opacity="0.85">
    <animate attributeName="cy" values="32;12;32" dur="2.1s" repeatCount="indefinite"/>
  </circle>
  <circle cx="20" cy="18" r="0.7" fill="#80deea" opacity="0.7"/>

  <!-- Sudario / Harapos desgarrados del Espectro que flotan en el vacío -->
  <path d="M14 64 C13 52, 17 44, 24 42 L32 47 L40 42 C47 44, 51 52, 50 64 L46 58 L42 64 L37 58 L32 64 L27 58 L22 64 L18 58 Z" fill="url(#mantoEspectral)" opacity="0.75"/>
  <path d="M18 64 C17 56, 21 48, 28 46 L32 50 L36 46 C43 48, 47 56, 46 64 Z" fill="#006064" opacity="0.6"/>

  <!-- Capucha espectral hecha de niebla funeraria -->
  <path d="M17 32 C17 15, 22 9, 32 9 C42 9, 47 15, 47 32 C47 44, 43 48, 39 49 C37 43, 38 37, 37 31 C36 22, 35 16, 32 16 C29 16, 28 22, 27 31 C26 37, 27 43, 25 49 C21 48, 17 44, 17 32 Z" fill="url(#mantoEspectral)" stroke="#004d40" stroke-width="0.6"/>

  <!-- Abismo interior de la capucha mortuoria -->
  <path d="M21 31 C21 17, 25 15, 32 15 C39 15, 43 17, 43 31 C43 40, 39 45, 32 47 C25 45, 21 40, 21 31 Z" fill="#030c12"/>

  <!-- Rostro espectral cadavérico consumido por el frío -->
  <path d="M24 28 C24 22, 27 19, 32 19 C37 19, 40 22, 40 28 C40 35, 37 40, 32 42 C27 40, 24 35, 24 28 Z" fill="#e0f7fa" opacity="0.35"/>

  <!-- Cuencas oscuras del espectro -->
  <ellipse cx="27" cy="27" rx="3.2" ry="2.6" fill="#02080c"/>
  <ellipse cx="37" cy="27" rx="3.2" ry="2.6" fill="#02080c"/>

  <!-- Ojos de Fuego Espectral que brillan en la muerte -->
  <circle cx="27" cy="27" r="2.2" fill="url(#fuegoAlma)">
    <animate attributeName="r" values="1.8;2.6;1.8" dur="1.6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="27" cy="27" r="0.8" fill="#ffffff"/>

  <circle cx="37" cy="27" r="2.2" fill="url(#fuegoAlma)">
    <animate attributeName="r" values="2.6;1.8;2.6" dur="1.6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="37" cy="27" r="0.8" fill="#ffffff"/>

  <!-- Fauces semiabiertas en lamento fantasmal eterno -->
  <path d="M29 35 Q32 34 35 35 Q34 40 32 41 Q30 40 29 35 Z" fill="#02080c"/>

  <!-- Corona espectral rota flotando sobre el sudario -->
  <path d="M20 13 L23 6 L27 10 L32 3 L37 10 L41 6 L44 13 L42 16 L22 16 Z" fill="url(#coronaEspectral)" stroke="#80deea" stroke-width="0.5" opacity="0.85">
    <animate attributeName="transform" type="translate" values="0,0; 0,-1.5; 0,0" dur="2s" repeatCount="indefinite"/>
  </path>
  <!-- Joya del alma en la corona -->
  <circle cx="32" cy="9" r="1.3" fill="#84ffff"/>
</svg>
