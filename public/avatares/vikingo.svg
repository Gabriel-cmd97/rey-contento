<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="bgVikingoFiordo" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="55%" stop-color="#0f2238"/>
      <stop offset="100%" stop-color="#030b14"/>
    </radialGradient>
    <linearGradient id="hierroNodicoPulido" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f1f5f9"/>
      <stop offset="35%" stop-color="#94a3b8"/>
      <stop offset="70%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="barbaRojizaVikinga" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="35%" stop-color="#c2410c"/>
      <stop offset="70%" stop-color="#9a3412"/>
      <stop offset="100%" stop-color="#431407"/>
    </linearGradient>
    <radialGradient id="ojoGlacial" cx="45%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#7dd3fc"/>
      <stop offset="75%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#034b75"/>
    </radialGradient>
    <linearGradient id="pielBerserker" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#fed7aa"/>
      <stop offset="85%" stop-color="#fba867"/>
      <stop offset="100%" stop-color="#c25712"/>
    </linearGradient>
    <linearGradient id="oroRunico" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#854d0e"/>
    </linearGradient>
  </defs>

  <!-- Fondo de fiordo gélido y noche ártica -->
  <circle cx="32" cy="32" r="32" fill="url(#bgVikingoFiordo)"/>

  <!-- Halo de ventisca / aurora boreal suave -->
  <circle cx="32" cy="24" r="23" fill="#38bdf8" opacity="0.12">
    <animate attributeName="opacity" values="0.08;0.2;0.08" dur="2.8s" repeatCount="indefinite"/>
  </circle>

  <!-- Ventisca y copos de nieve azotando -->
  <circle cx="12" cy="18" r="0.9" fill="#ffffff" opacity="0.9">
    <animate attributeName="cy" values="18;30;18" dur="2.2s" repeatCount="indefinite"/>
    <animate attributeName="cx" values="12;8;12" dur="2.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="52" cy="14" r="0.8" fill="#e2e8f0" opacity="0.85">
    <animate attributeName="cy" values="14;26;14" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="50" cy="46" r="0.7" fill="#ffffff" opacity="0.7"/>
  <circle cx="14" cy="48" r="0.7" fill="#cbd5e1" opacity="0.7"/>

  <!-- Manto de piel de oso pardo y cota de malla anillada -->
  <path d="M10 64 C10 49, 16 43, 24 42 L32 46 L40 42 C48 43, 54 49, 54 64 Z" fill="#0f172a"/>
  <!-- Pieles gruesas en los hombros con mechones salvajes -->
  <path d="M8 64 L12 51 L8 45 L16 43 L23 44 L21 64 Z" fill="#334155"/>
  <path d="M56 64 L52 51 L56 45 L48 43 L41 44 L43 64 Z" fill="#334155"/>
  <!-- Broche anular vikingo con aguja de oro viejo -->
  <circle cx="20" cy="48" r="2.4" fill="none" stroke="url(#oroRunico)" stroke-width="0.9"/>
  <line x1="17" y1="51.5" x2="25" y2="44.5" stroke="url(#oroRunico)" stroke-width="0.9"/>

  <!-- Barba trenzada formidable de Jarl vikingo con anillos rúnicos -->
  <path d="M19 38 C19 48, 23 58, 27 64 L37 64 C41 58, 45 48, 45 38 C41 41, 37 42, 32 42 C27 42, 23 41, 19 38 Z" fill="url(#barbaRojizaVikinga)"/>
  <!-- Mechones trenzados de la barba con volumen -->
  <path d="M25 43 C25 51, 28 59, 29 64 L35 64 C36 59, 39 51, 39 43 Z" fill="#9a3412"/>
  <!-- Anillos rúnicos dorados sujetando las trenzas -->
  <rect x="28.5" y="52" width="7" height="2.8" rx="0.6" fill="url(#oroRunico)" stroke="#451a03" stroke-width="0.4"/>
  <line x1="32" y1="52.5" x2="32" y2="54.5" stroke="#451a03" stroke-width="0.6"/>
  <rect x="29" y="58" width="6" height="2.2" rx="0.5" fill="#e2e8f0" stroke="#475569" stroke-width="0.4"/>

  <!-- Bigote espeso caído a los lados -->
  <path d="M23 37 C26 39, 29 41, 32 40 C35 41, 38 39, 41 37 C39 41, 35 44, 32 43 C29 44, 25 41, 23 37 Z" fill="url(#barbaRojizaVikinga)" stroke="#431407" stroke-width="0.4"/>

  <!-- Rostro aguerrido y ceñudo del Berserker -->
  <path d="M22 25 C22 21, 26 19, 32 19 C38 19, 42 21, 42 25 C42 34, 38 38, 32 39 C26 38, 22 34, 22 25 Z" fill="url(#pielBerserker)"/>

  <!-- Ojos nórdicos de azul glacial con mirada implacable -->
  <!-- Ojo izquierdo -->
  <ellipse cx="27" cy="27.5" rx="2.4" ry="1.6" fill="#0f172a"/>
  <circle cx="27" cy="27.5" r="1.3" fill="url(#ojoGlacial)"/>
  <circle cx="27.4" cy="27" r="0.4" fill="#ffffff"/>

  <!-- Ojo derecho con cicatriz de batalla -->
  <ellipse cx="37" cy="27.5" rx="2.4" ry="1.6" fill="#0f172a"/>
  <circle cx="37" cy="27.5" r="1.3" fill="url(#ojoGlacial)"/>
  <circle cx="37.4" cy="27" r="0.4" fill="#ffffff"/>
  <!-- Cicatriz roja cruzando el ojo derecho -->
  <line x1="37" y1="22" x2="38" y2="34" stroke="#991b1b" stroke-width="0.8" opacity="0.85"/>

  <!-- Ceño fruncido y arrugas de batalla -->
  <path d="M24 24.5 Q27 23.5 30 25.5" stroke="#7c2d12" stroke-width="1.2" fill="none"/>
  <path d="M40 24.5 Q37 23.5 34 25.5" stroke="#7c2d12" stroke-width="1.2" fill="none"/>

  <!-- Casco Gjermundbu (Yelmo de anteojeras y cresta de hierro nórdico) -->
  <!-- Bóveda del yelmo forjada en 4 cuartos -->
  <path d="M18 23 C18 11, 23 7, 32 7 C41 7, 46 11, 46 23 L18 23 Z" fill="url(#hierroNodicoPulido)" stroke="#090d16" stroke-width="0.9"/>

  <!-- Cresta central reforzada del yelmo -->
  <path d="M30.5 6 L33.5 6 L33.5 23 L30.5 23 Z" fill="url(#oroRunico)" stroke="#090d16" stroke-width="0.4"/>
  <line x1="32" y1="6" x2="32" y2="23" stroke="#fef08a" stroke-width="0.7"/>

  <!-- Banda perimetral con remaches de bronce -->
  <rect x="17.5" y="21" width="29" height="3" fill="#1e293b" stroke="#090d16" stroke-width="0.5"/>
  <circle cx="21" cy="22.5" r="0.6" fill="#facc15"/>
  <circle cx="26" cy="22.5" r="0.6" fill="#facc15"/>
  <circle cx="32" cy="22.5" r="0.7" fill="#fef08a"/>
  <circle cx="38" cy="22.5" r="0.6" fill="#facc15"/>
  <circle cx="43" cy="22.5" r="0.6" fill="#facc15"/>

  <!-- Anteojeras de hierro vikingo (Espectáculo facial y protección nasal) -->
  <path d="M22 23.5 C22 31.5, 30 32.5, 30 26.5 L31 26.5 L31 35 L33 35 L33 26.5 L34 26.5 C34 32.5, 42 31.5, 42 23.5 L35 23.5 C34 25.5, 33 26.5, 32 26.5 C31 26.5, 30 25.5, 29 23.5 Z" fill="url(#hierroNodicoPulido)" stroke="#090d16" stroke-width="0.8"/>

  <!-- Remaches en la máscara de hierro -->
  <circle cx="32" cy="30" r="0.6" fill="#facc15"/>
  <circle cx="25" cy="24" r="0.5" fill="#f1f5f9"/>
  <circle cx="39" cy="24" r="0.5" fill="#f1f5f9"/>
</svg>
