<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="bgVikingo" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#2c3e50"/>
      <stop offset="55%" stop-color="#18232e"/>
      <stop offset="100%" stop-color="#0a0e14"/>
    </radialGradient>
    <linearGradient id="hierroNodico" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="40%" stop-color="#94a3b8"/>
      <stop offset="75%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="barbaRojiza" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e67e22"/>
      <stop offset="45%" stop-color="#d35400"/>
      <stop offset="85%" stop-color="#a04000"/>
      <stop offset="100%" stop-color="#6e2c00"/>
    </linearGradient>
    <radialGradient id="ojoNordico" cx="45%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#70d6ff"/>
      <stop offset="80%" stop-color="#0080ff"/>
      <stop offset="100%" stop-color="#003566"/>
    </radialGradient>
    <linearGradient id="pielGuerrero" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fdfefe"/>
      <stop offset="50%" stop-color="#f5cba7"/>
      <stop offset="100%" stop-color="#dc7633"/>
    </linearGradient>
  </defs>

  <!-- Fondo de fiordo gélido -->
  <circle cx="32" cy="32" r="32" fill="url(#bgVikingo)"/>

  <!-- Bruma y nieve del norte -->
  <circle cx="12" cy="20" r="0.8" fill="#ffffff" opacity="0.8"/>
  <circle cx="52" cy="16" r="0.9" fill="#cbd5e1" opacity="0.75"/>
  <circle cx="50" cy="46" r="0.7" fill="#ffffff" opacity="0.7"/>

  <!-- Manto de piel de oso/lobo y cota de malla -->
  <path d="M12 64 C12 50, 18 44, 25 43 L32 47 L39 43 C46 44, 52 50, 52 64 Z" fill="#2c3e50"/>
  <!-- Piel gruesa sobre los hombros con mechones -->
  <path d="M10 64 L13 52 L9 46 L17 44 L24 45 L22 64 Z" fill="#475569"/>
  <path d="M54 64 L51 52 L55 46 L47 44 L40 45 L42 64 Z" fill="#475569"/>
  <!-- Broche anular vikingo con aguja -->
  <circle cx="21" cy="48" r="2.2" fill="none" stroke="#f1c40f" stroke-width="0.8"/>
  <line x1="18" y1="51" x2="25" y2="45" stroke="#f1c40f" stroke-width="0.8"/>

  <!-- Barba trenzada formidable de Jarl vikingo (con anillos de hueso/hierro) -->
  <path d="M20 38 C20 48, 24 58, 27 64 L37 64 C40 58, 44 48, 44 38 C40 41, 36 42, 32 42 C28 42, 24 41, 20 38 Z" fill="url(#barbaRojiza)"/>
  <!-- Mechones trenzados de la barba -->
  <path d="M26 44 C26 52, 28 60, 29 64 L35 64 C36 60, 38 52, 38 44 Z" fill="#a04000"/>
  <!-- Anillos rúnicos sujetando las trenzas -->
  <rect x="29" y="52" width="6" height="2.5" rx="0.5" fill="#f1c40f" stroke="#7d6608" stroke-width="0.4"/>
  <rect x="29.5" y="58" width="5" height="2" rx="0.5" fill="#cbd5e1" stroke="#475569" stroke-width="0.3"/>

  <!-- Bigote espeso caído a los lados -->
  <path d="M24 37 C26 39, 29 41, 32 40 C35 41, 38 39, 40 37 C38 41, 34 44, 32 43 C30 44, 26 41, 24 37 Z" fill="url(#barbaRojiza)"/>

  <!-- Rostro aguerrido y ceñudo del Berserker -->
  <path d="M22 26 C22 22, 26 20, 32 20 C38 20, 42 22, 42 26 C42 34, 38 38, 32 39 C26 38, 22 34, 22 26 Z" fill="url(#pielGuerrero)"/>

  <!-- Ojos nórdicos de azul glacial con mirada amenazante -->
  <!-- Ojo izquierdo -->
  <ellipse cx="27" cy="28" rx="2.5" ry="1.6" fill="#0f172a"/>
  <circle cx="27" cy="28" r="1.2" fill="url(#ojoNordico)"/>
  <circle cx="27.4" cy="27.5" r="0.4" fill="#ffffff"/>

  <!-- Ojo derecho con cicatriz de batalla -->
  <ellipse cx="37" cy="28" rx="2.5" ry="1.6" fill="#0f172a"/>
  <circle cx="37" cy="28" r="1.2" fill="url(#ojoNordico)"/>
  <circle cx="37.4" cy="27.5" r="0.4" fill="#ffffff"/>
  <!-- Cicatriz cruzando el ojo derecho -->
  <line x1="37" y1="23" x2="38" y2="34" stroke="#78281f" stroke-width="0.7" opacity="0.8"/>

  <!-- Ceño fruncido y arrugas de batalla -->
  <path d="M24 25 Q27 24 30 26" stroke="#501814" stroke-width="1.2" fill="none"/>
  <path d="M40 25 Q37 24 34 26" stroke="#501814" stroke-width="1.2" fill="none"/>

  <!-- Casco Gjermundbu (Yelmo de espectáculo / anteojeras de hierro nórdico) -->
  <!-- Bóveda del yelmo -->
  <path d="M19 23 C19 12, 24 8, 32 8 C40 8, 45 12, 45 23 L19 23 Z" fill="url(#hierroNodico)" stroke="#0f172a" stroke-width="0.8"/>
  <!-- Cresta central reforzada del yelmo -->
  <path d="M30.5 7 L33.5 7 L33.5 23 L30.5 23 Z" fill="#334155"/>
  <line x1="32" y1="7" x2="32" y2="23" stroke="#cbd5e1" stroke-width="0.6"/>

  <!-- Banda perimetral con remaches de forja -->
  <rect x="18" y="21" width="28" height="3" fill="#1e293b"/>
  <circle cx="21" cy="22.5" r="0.6" fill="#cbd5e1"/>
  <circle cx="26" cy="22.5" r="0.6" fill="#cbd5e1"/>
  <circle cx="32" cy="22.5" r="0.6" fill="#cbd5e1"/>
  <circle cx="38" cy="22.5" r="0.6" fill="#cbd5e1"/>
  <circle cx="43" cy="22.5" r="0.6" fill="#cbd5e1"/>

  <!-- Anteojeras de hierro vikingo (máscara de ojos y protección nasal) -->
  <path d="M22 24 C22 32, 30 33, 30 27 L31 27 L31 35 L33 35 L33 27 L34 27 C34 33, 42 32, 42 24 L35 24 C34 26, 33 27, 32 27 C31 27, 30 26, 29 24 Z" fill="url(#hierroNodico)" stroke="#0f172a" stroke-width="0.7"/>

  <!-- Remache en la nariz de hierro -->
  <circle cx="32" cy="30" r="0.6" fill="#cbd5e1"/>
</svg>
