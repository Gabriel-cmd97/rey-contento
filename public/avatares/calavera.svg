<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="bgCalavera" cx="50%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#3d4852"/>
      <stop offset="60%" stop-color="#182026"/>
      <stop offset="100%" stop-color="#0a0e12"/>
    </radialGradient>
    <linearGradient id="oroCorona" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f9e79f"/>
      <stop offset="45%" stop-color="#f1c40f"/>
      <stop offset="85%" stop-color="#b7950b"/>
      <stop offset="100%" stop-color="#7d6608"/>
    </linearGradient>
    <linearGradient id="cráneoHueso" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fdfefe"/>
      <stop offset="60%" stop-color="#e5e8e8"/>
      <stop offset="100%" stop-color="#95a5a6"/>
    </linearGradient>
    <radialGradient id="fuegoVerde" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a3e4d7"/>
      <stop offset="45%" stop-color="#2ecc71"/>
      <stop offset="85%" stop-color="#117864"/>
      <stop offset="100%" stop-color="#0b5345" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Fondo oscuro medieval -->
  <circle cx="32" cy="32" r="32" fill="url(#bgCalavera)"/>

  <!-- Halo espectral sutil -->
  <circle cx="32" cy="32" r="28" fill="#1abc9c" opacity="0.15">
    <animate attributeName="opacity" values="0.1;0.25;0.1" dur="2.8s" repeatCount="indefinite"/>
  </circle>

  <!-- Manto real desgastado con hombreras de hierro -->
  <path d="M12 64 C13 50, 18 43, 25 42 L32 47 L39 42 C46 43, 51 50, 52 64 Z" fill="#2c3e50"/>
  <path d="M26 42 L32 47 L38 42 L32 39 Z" fill="url(#oroCorona)"/>
  <circle cx="32" cy="43.5" r="1.6" fill="#c0392b" stroke="#f1c40f" stroke-width="0.4"/>

  <!-- Cráneo de Rey Esqueleto ancestral -->
  <path d="M20 28 C20 17, 24 15, 32 15 C40 15, 44 17, 44 28 C44 34, 42 38, 38 40 C38 43, 36 45, 36 46 L28 46 C28 45, 26 43, 26 40 C22 38, 20 34, 20 28 Z" fill="url(#cráneoHueso)"/>
  <!-- Relieves y suturas óseas -->
  <path d="M30 18 L32 20 L31 22" stroke="#7f8c8d" stroke-width="0.6" fill="none" opacity="0.6"/>
  <path d="M22 34 C24 37, 26 39, 27 43 L25 43 C23 40, 21 37, 21 34 Z" fill="#7f8c8d" opacity="0.5"/>
  <path d="M42 34 C40 37, 38 39, 37 43 L39 43 C41 40, 43 37, 43 34 Z" fill="#7f8c8d" opacity="0.5"/>

  <!-- Fosa nasal en triángulo invertido gótico -->
  <polygon points="32,36 30.5,40 33.5,40" fill="#17202a"/>

  <!-- Dientes detallados -->
  <rect x="28.5" y="44" width="1.5" height="2" fill="#1c2833"/>
  <rect x="31" y="44" width="1.8" height="2.4" fill="#1c2833"/>
  <rect x="33.8" y="44" width="1.5" height="2" fill="#1c2833"/>

  <!-- Cuencas oculares oscuras -->
  <path d="M23 27 C23 23, 29 23, 29 28 C29 32, 24 33, 23 27 Z" fill="#0f141a"/>
  <path d="M41 27 C41 23, 35 23, 35 28 C35 32, 40 33, 41 27 Z" fill="#0f141a"/>

  <!-- Llamas espectrales en las cuencas (fuego verde esmeralda místico) animadas -->
  <g>
    <circle cx="26" cy="28" r="2.4" fill="url(#fuegoVerde)">
      <animate attributeName="r" values="1.8;2.8;1.8" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="26" cy="28" r="1" fill="#ffffff">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="38" cy="28" r="2.4" fill="url(#fuegoVerde)">
      <animate attributeName="r" values="2.8;1.8;2.8" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="38" cy="28" r="1" fill="#ffffff">
      <animate attributeName="opacity" values="1;0.7;1" dur="1.8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Corona Real de Oro envejecida con púas y gemas -->
  <path d="M18 19 L21 11 L25 17 L32 8 L39 17 L43 11 L46 19 L45 22 L19 22 Z" fill="url(#oroCorona)" stroke="#7d6608" stroke-width="0.6"/>
  <polygon points="32,12 34,14.5 32,17 30,14.5" fill="#2ecc71" stroke="#f1c40f" stroke-width="0.4"/>
  <circle cx="22" cy="15" r="1.1" fill="#c0392b"/>
  <circle cx="42" cy="15" r="1.1" fill="#c0392b"/>
</svg>
