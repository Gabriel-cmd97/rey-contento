<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="bgHechicera" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#3b154c"/>
      <stop offset="55%" stop-color="#1c0b29"/>
      <stop offset="100%" stop-color="#09030e"/>
    </radialGradient>
    <linearGradient id="mantoPurpura" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7d3c98"/>
      <stop offset="40%" stop-color="#512e5f"/>
      <stop offset="85%" stop-color="#2c1435"/>
      <stop offset="100%" stop-color="#120617"/>
    </linearGradient>
    <linearGradient id="oroArcano" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f9e79f"/>
      <stop offset="40%" stop-color="#f1c40f"/>
      <stop offset="85%" stop-color="#b7950b"/>
      <stop offset="100%" stop-color="#6e5603"/>
    </linearGradient>
    <radialGradient id="orbeArcano" cx="40%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#a569bd"/>
      <stop offset="70%" stop-color="#5b2c6f"/>
      <stop offset="100%" stop-color="#1b002c"/>
    </radialGradient>
    <radialGradient id="ojoArcano" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#d2b4de"/>
      <stop offset="80%" stop-color="#8e44ad"/>
      <stop offset="100%" stop-color="#4a235a"/>
    </radialGradient>
    <linearGradient id="pielPalida" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fdfefe"/>
      <stop offset="50%" stop-color="#f4ecf7"/>
      <stop offset="100%" stop-color="#d7bde2"/>
    </linearGradient>
  </defs>

  <!-- Fondo de vacío arcano -->
  <circle cx="32" cy="32" r="32" fill="url(#bgHechicera)"/>

  <!-- Círculo de invocación rúnico en el fondo con rotación sutil -->
  <g opacity="0.25">
    <circle cx="32" cy="32" r="26" stroke="#af7ac5" stroke-width="0.7" fill="none" stroke-dasharray="3,2"/>
    <circle cx="32" cy="32" r="22" stroke="#af7ac5" stroke-width="0.5" fill="none"/>
    <polygon points="32,8 53,44 11,44" stroke="#af7ac5" stroke-width="0.5" fill="none"/>
    <polygon points="32,56 11,20 53,20" stroke="#af7ac5" stroke-width="0.5" fill="none"/>
    <animateTransform attributeName="transform" type="rotate" from="0 32 32" to="360 32 32" dur="25s" repeatCount="indefinite"/>
  </g>

  <!-- Destellos de energía mística ascendente -->
  <circle cx="14" cy="26" r="0.8" fill="#e8daef" opacity="0.9">
    <animate attributeName="cy" values="26;12;26" dur="2.8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.9;0.2;0.9" dur="2.8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="48" cy="18" r="0.9" fill="#bb8fce" opacity="0.8">
    <animate attributeName="cy" values="18;8;18" dur="2.1s" repeatCount="indefinite"/>
  </circle>
  <circle cx="50" cy="42" r="0.7" fill="#f4ecf7" opacity="0.7"/>

  <!-- Manto y túnica ceremonial arcana -->
  <path d="M12 64 C13 49, 18 43, 24 41 L32 46 L40 41 C46 43, 51 49, 52 64 Z" fill="url(#mantoPurpura)"/>
  <path d="M24 41 L32 47 L40 41 L32 37 Z" fill="url(#oroArcano)"/>
  <circle cx="32" cy="42" r="1.5" fill="#8e44ad" stroke="#f1c40f" stroke-width="0.4"/>

  <!-- Capucha majestuosa que cae sobre la cabeza -->
  <!-- Capa exterior de la capucha -->
  <path d="M17 32 C17 14, 23 8, 32 8 C41 8, 47 14, 47 32 C47 43, 43 45, 41 46 C37 40, 39 34, 38 28 C37 20, 35 15, 32 15 C29 15, 27 20, 26 28 C25 34, 27 40, 23 46 C21 45, 17 43, 17 32 Z" fill="url(#mantoPurpura)" stroke="#1a0026" stroke-width="0.6"/>

  <!-- Borde dorado bordado de la capucha -->
  <path d="M17 32 C17 14, 23 8, 32 8 C41 8, 47 14, 47 32" stroke="url(#oroArcano)" stroke-width="0.9" fill="none"/>

  <!-- Interior oscuro y misterioso de la capucha -->
  <path d="M21 30 C21 16, 25 14, 32 14 C39 14, 43 16, 43 30 C43 38, 39 42, 32 44 C25 42, 21 38, 21 30 Z" fill="#15061e"/>

  <!-- Mechones de cabello negro/noche azabache cayendo a los lados -->
  <path d="M23 27 C24 35, 23 42, 21 47 C24 43, 26 38, 25 31 Z" fill="#09020d"/>
  <path d="M41 27 C40 35, 41 42, 43 47 C40 43, 38 38, 39 31 Z" fill="#09020d"/>

  <!-- Rostro pálido enigmático y esbelto de la Hechicera -->
  <path d="M24 26 C24 20, 27 18, 32 18 C37 18, 40 20, 40 26 C40 34, 37 39, 32 41 C27 39, 24 34, 24 26 Z" fill="url(#pielPalida)"/>

  <!-- Tiara / Diadema de oro arcano con gema violeta en la frente -->
  <path d="M26 21 Q32 24 38 21 L38 22 Q32 25 26 22 Z" fill="url(#oroArcano)"/>
  <polygon points="32,20 33.5,22.5 32,25 30.5,22.5" fill="#af7ac5" stroke="#f1c40f" stroke-width="0.3"/>
  <circle cx="32" cy="22.5" r="0.6" fill="#ffffff"/>

  <!-- Ojos arcanos hechiceros que brillan con fulgor místico -->
  <!-- Ojo izquierdo -->
  <path d="M26 27 Q28.5 25.5 30.5 27 Q28.5 28.5 26 27 Z" fill="#15061e"/>
  <ellipse cx="28.5" cy="27" rx="1.5" ry="1.1" fill="url(#ojoArcano)"/>
  <circle cx="28.5" cy="27" r="0.4" fill="#ffffff"/>

  <!-- Ojo derecho -->
  <path d="M38 27 Q35.5 25.5 33.5 27 Q35.5 28.5 38 27 Z" fill="#15061e"/>
  <ellipse cx="35.5" cy="27" rx="1.5" ry="1.1" fill="url(#ojoArcano)"/>
  <circle cx="35.5" cy="27" r="0.4" fill="#ffffff"/>

  <!-- Pestañas y cejas finas estilizadas -->
  <path d="M26 25 Q28.5 24 31 25.5" stroke="#2c1435" stroke-width="0.7" fill="none"/>
  <path d="M38 25 Q35.5 24 33 25.5" stroke="#2c1435" stroke-width="0.7" fill="none"/>

  <!-- Nariz refinada y labios de corteza de cereza -->
  <path d="M32 27 L31.5 31.5 L32.5 32" stroke="#bb8fce" stroke-width="0.5" fill="none"/>
  <path d="M30.5 34.5 Q32 34 33.5 34.5 Q32 36.5 30.5 34.5 Z" fill="#78281f"/>

  <!-- Marca de runa mística en la mejilla izquierda -->
  <circle cx="27" cy="31" r="0.4" fill="#af7ac5" opacity="0.8"/>
  <path d="M27 30 L27 32" stroke="#af7ac5" stroke-width="0.3"/>

  <!-- Orbe / Catalizador Arcano flotante en primer plano -->
  <g>
    <!-- Aura pulsante del orbe -->
    <circle cx="48" cy="46" r="9" fill="#bb8fce" opacity="0.2">
      <animate attributeName="r" values="7;10;7" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.15;0.35;0.15" dur="2s" repeatCount="indefinite"/>
    </circle>
    <!-- Anillo astral giratorio rodeando el orbe -->
    <ellipse cx="48" cy="46" rx="8" ry="2.5" fill="none" stroke="url(#oroArcano)" stroke-width="0.6" transform="rotate(-25 48 46)">
      <animateTransform attributeName="transform" type="rotate" from="-25 48 46" to="335 48 46" dur="6s" repeatCount="indefinite"/>
    </ellipse>
    <!-- Esfera de cristal arcano -->
    <circle cx="48" cy="46" r="5" fill="url(#orbeArcano)" stroke="#f4ecf7" stroke-width="0.4"/>
    <circle cx="46.5" cy="44.5" r="1.3" fill="#ffffff" opacity="0.85"/>
  </g>
</svg>
