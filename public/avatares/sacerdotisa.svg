<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="bgSacerdotisaFuego" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#450a0a"/>
      <stop offset="55%" stop-color="#240404"/>
      <stop offset="100%" stop-color="#0a0101"/>
    </radialGradient>
    <linearGradient id="oroFuegoSacerdotisa" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="35%" stop-color="#f59e0b"/>
      <stop offset="75%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </linearGradient>
    <radialGradient id="rubiCorazonFuego" cx="40%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#fecdd3"/>
      <stop offset="35%" stop-color="#f43f5e"/>
      <stop offset="70%" stop-color="#be123c"/>
      <stop offset="100%" stop-color="#4c0519"/>
    </radialGradient>
    <linearGradient id="pielDamaFuego" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#ffe4e6"/>
      <stop offset="85%" stop-color="#fecdd3"/>
      <stop offset="100%" stop-color="#fda4af"/>
    </linearGradient>
    <linearGradient id="terciopeloRojoSacerdotisa" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#991b1b"/>
      <stop offset="50%" stop-color="#7f1d1d"/>
      <stop offset="85%" stop-color="#450a0a"/>
      <stop offset="100%" stop-color="#1c0404"/>
    </linearGradient>
    <radialGradient id="ojoRubiEncanto" cx="45%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="35%" stop-color="#ef4444"/>
      <stop offset="75%" stop-color="#991b1b"/>
      <stop offset="100%" stop-color="#450a0a"/>
    </radialGradient>
  </defs>

  <!-- Fondo de templo del fuego eterno -->
  <circle cx="32" cy="32" r="32" fill="url(#bgSacerdotisaFuego)"/>

  <!-- Halo de calor y fuego místico -->
  <circle cx="32" cy="28" r="23" fill="#ef4444" opacity="0.14">
    <animate attributeName="opacity" values="0.1;0.24;0.1" dur="2.4s" repeatCount="indefinite"/>
  </circle>

  <!-- Pavesas y chispas de fuego sagrado ascendiendo -->
  <circle cx="14" cy="20" r="0.9" fill="#f87171" opacity="0.85">
    <animate attributeName="cy" values="20;10;20" dur="2.1s" repeatCount="indefinite"/>
  </circle>
  <circle cx="50" cy="22" r="1" fill="#f59e0b" opacity="0.9">
    <animate attributeName="cy" values="22;12;22" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="16" cy="46" r="0.7" fill="#fbbf24" opacity="0.75"/>
  <circle cx="50" cy="44" r="0.8" fill="#f87171" opacity="0.8"/>

  <!-- Manto y túnica de terciopelo carmesí noble -->
  <path d="M10 64 C11 50, 17 42, 23 41 L32 46 L41 41 C47 42, 53 50, 54 64 Z" fill="#450a0a"/>
  <path d="M25 43 L32 50 L39 43 Z" fill="#7f1d1d"/>

  <!-- Gran Gargantilla dorada con el Rubí Ardiente de la Mujer Roja -->
  <rect x="23" y="42" width="18" height="3.2" rx="1.6" fill="url(#oroFuegoSacerdotisa)" stroke="#450a0a" stroke-width="0.4"/>

  <!-- Rubí hexagonal que late con fuego vivo y resplandor -->
  <polygon points="32,41 36,45.5 32,50 28,45.5" fill="url(#rubiCorazonFuego)" stroke="#fef08a" stroke-width="0.7">
    <animate attributeName="filter" values="drop-shadow(0 0 2px #ef4444);drop-shadow(0 0 8px #ef4444);drop-shadow(0 0 2px #ef4444)" dur="1.7s" repeatCount="indefinite"/>
  </polygon>
  <!-- Destello especular en el rubí -->
  <circle cx="32" cy="45" r="1.1" fill="#ffffff">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="1.7s" repeatCount="indefinite"/>
  </circle>

  <!-- Cabello bermellón oscuro ondulado que cae sobre los hombros -->
  <path d="M19 28 C19 18, 24 12, 32 12 C40 12, 45 18, 45 28 C45 38, 43 46, 42 49 L39 43 C40 36, 41 28, 41 25 C41 18, 37 16, 32 16 C27 16, 23 18, 23 25 C23 28, 24 36, 25 43 L22 49 C21 46, 19 38, 19 28 Z" fill="#500707"/>
  <path d="M21 28 Q23 38 24 45" stroke="#991b1b" stroke-width="0.8" fill="none"/>
  <path d="M43 28 Q41 38 40 45" stroke="#991b1b" stroke-width="0.8" fill="none"/>

  <!-- Rostro fino de sacerdotisa con tez de porcelana rosada -->
  <path d="M23 25 C23 18, 26 17, 32 17 C38 17, 41 18, 41 25 C41 34, 38 40, 32 43 C26 40, 23 34, 23 25 Z" fill="url(#pielDamaFuego)"/>

  <!-- Gran Capucha de terciopelo rojo oscuro que enmarca el rostro -->
  <path d="M14 36 C14 15, 21 6, 32 5 C43 6, 50 15, 50 36 C46 39, 43 37, 42 34 C43 18, 38 12, 32 12 C26 12, 21 18, 22 34 C21 37, 18 39, 14 36 Z" fill="url(#terciopeloRojoSacerdotisa)" stroke="#240404" stroke-width="0.8"/>

  <!-- Ribete bordado en hilo de oro fino en la capucha -->
  <path d="M14 36 C14 15, 21 6, 32 5 C43 6, 50 15, 50 36" stroke="url(#oroFuegoSacerdotisa)" stroke-width="0.9" fill="none"/>

  <!-- Cejas finas y elegantes con arco hechicero -->
  <path d="M25 25.5 C27 24, 30 25, 30 26.5" stroke="#450a0a" stroke-width="0.8" fill="none"/>
  <path d="M39 25.5 C37 24, 34 25, 34 26.5" stroke="#450a0a" stroke-width="0.8" fill="none"/>

  <!-- Ojos de rubí ardiente con mirada hechicera e hipnótica -->
  <ellipse cx="28" cy="28" rx="2" ry="1.5" fill="#1c0404"/>
  <ellipse cx="28" cy="28" rx="1.6" ry="1.3" fill="url(#ojoRubiEncanto)"/>
  <circle cx="28" cy="28" r="0.6" fill="#450a0a"/>
  <circle cx="28.4" cy="27.6" r="0.4" fill="#ffffff"/>

  <ellipse cx="36" cy="28" rx="2" ry="1.5" fill="#1c0404"/>
  <ellipse cx="36" cy="28" rx="1.6" ry="1.3" fill="url(#ojoRubiEncanto)"/>
  <circle cx="36" cy="28" r="0.6" fill="#450a0a"/>
  <circle cx="36.4" cy="27.6" r="0.4" fill="#ffffff"/>

  <!-- Labios bermellón rubí esculpidos -->
  <path d="M29.5 36.5 C31 35.5, 33 35.5, 34.5 36.5 C33.5 38.5, 30.5 38.5, 29.5 36.5 Z" fill="#991b1b"/>
</svg>
