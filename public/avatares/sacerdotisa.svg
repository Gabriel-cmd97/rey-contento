<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="bgFuego" cx="50%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#4a0e0e"/>
      <stop offset="60%" stop-color="#200505"/>
      <stop offset="100%" stop-color="#0a0101"/>
    </radialGradient>
    <linearGradient id="oroRojo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f9ca24"/>
      <stop offset="60%" stop-color="#f0932b"/>
      <stop offset="100%" stop-color="#b71540"/>
    </linearGradient>
    <radialGradient id="rubiFuego" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff7675"/>
      <stop offset="40%" stop-color="#d63031"/>
      <stop offset="85%" stop-color="#641e16"/>
      <stop offset="100%" stop-color="#2c0b0b"/>
    </radialGradient>
    <linearGradient id="pielDama" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fcedea"/>
      <stop offset="50%" stop-color="#f8d7da"/>
      <stop offset="100%" stop-color="#e2a8a8"/>
    </linearGradient>
  </defs>

  <!-- Fondo de templo del fuego -->
  <circle cx="32" cy="32" r="32" fill="url(#bgFuego)"/>

  <!-- Chispas místicas ascendentes -->
  <circle cx="16" cy="20" r="0.8" fill="#ff7675" opacity="0.8">
    <animate attributeName="cy" values="20;12;20" dur="2.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.8;0.2;0.8" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="48" cy="22" r="1.1" fill="#f0932b" opacity="0.9">
    <animate attributeName="cy" values="22;14;22" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="50" cy="40" r="0.7" fill="#ff7675" opacity="0.7"/>

  <!-- Túnica y manto carmesí profundo -->
  <path d="M12 64 C13 50, 18 42, 24 41 L32 46 L40 41 C46 42, 51 50, 52 64 Z" fill="#4d0e17"/>
  <path d="M26 43 L32 50 L38 43 Z" fill="#781122"/>

  <!-- Gargantilla dorada antigua de la mujer roja con rubí místico -->
  <rect x="25" y="42" width="14" height="3" rx="1.5" fill="url(#oroRojo)"/>
  <!-- Gran Rubí del cuello que late con fuego vivo -->
  <polygon points="32,41 35.5,45 32,49 28.5,45" fill="url(#rubiFuego)" stroke="#f9ca24" stroke-width="0.6">
    <animate attributeName="filter" values="drop-shadow(0 0 2px #ff4757);drop-shadow(0 0 8px #ff4757);drop-shadow(0 0 2px #ff4757)" dur="1.8s" repeatCount="indefinite"/>
  </polygon>
  <circle cx="32" cy="45" r="1" fill="#fff">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="1.8s" repeatCount="indefinite"/>
  </circle>

  <!-- Cabello bermellón oscuro / caoba -->
  <path d="M20 28 C20 18, 25 12, 32 12 C39 12, 44 18, 44 28 C44 38, 42 45, 41 48 L38 43 C39 36, 40 28, 40 25 C40 18, 36 16, 32 16 C28 16, 24 18, 24 25 C24 28, 25 36, 26 43 L23 48 C22 45, 20 38, 20 28 Z" fill="#58181f"/>

  <!-- Rostro fino y pálido -->
  <path d="M24 25 C24 19, 27 18, 32 18 C37 18, 40 19, 40 25 C40 33, 38 39, 32 42 C26 39, 24 33, 24 25 Z" fill="url(#pielDama)"/>

  <!-- Capucha carmesí noble que cae a los lados -->
  <path d="M15 36 C15 15, 22 7, 32 6 C42 7, 49 15, 49 36 C45 38, 43 36, 42 33 C43 18, 38 12, 32 12 C26 12, 21 18, 22 33 C21 36, 19 38, 15 36 Z" fill="#801423"/>

  <!-- Mirada hechicera y labios carmesí -->
  <path d="M26 27 C28 26, 30 27, 30 28 C29 29, 27 29, 26 27 Z" fill="#1e0508"/>
  <ellipse cx="28.5" cy="27.8" rx="1.2" ry="1.2" fill="#c0392b"/>
  <circle cx="28.5" cy="27.8" r="0.6" fill="#f0932b"/>

  <path d="M38 27 C36 26, 34 27, 34 28 C35 29, 37 29, 38 27 Z" fill="#1e0508"/>
  <ellipse cx="35.5" cy="27.8" rx="1.2" ry="1.2" fill="#c0392b"/>
  <circle cx="35.5" cy="27.8" r="0.6" fill="#f0932b"/>

  <!-- Labios de rubí -->
  <path d="M30 36 C31 35, 33 35, 34 36 C33 38, 31 38, 30 36 Z" fill="#a81a2e"/>
</svg>
