<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="bgHierroForja" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#3d1d13"/>
      <stop offset="55%" stop-color="#1c0b06"/>
      <stop offset="100%" stop-color="#080201"/>
    </radialGradient>
    <linearGradient id="aceroHierroOscuro" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="35%" stop-color="#64748b"/>
      <stop offset="70%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="puasEspadas" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="50%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <radialGradient id="fuegoVisorBrasa" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffedd5"/>
      <stop offset="35%" stop-color="#fb923c"/>
      <stop offset="70%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#9a3412"/>
    </radialGradient>
  </defs>

  <!-- Fondo de forja y carbón al rojo vivo -->
  <circle cx="32" cy="32" r="32" fill="url(#bgHierroForja)"/>

  <!-- Resplandor de magma interior -->
  <circle cx="32" cy="30" r="23" fill="#ea580c" opacity="0.14">
    <animate attributeName="opacity" values="0.1;0.22;0.1" dur="2.4s" repeatCount="indefinite"/>
  </circle>

  <!-- Chispas incandescentes de fundición -->
  <circle cx="12" cy="22" r="0.9" fill="#fdba74" opacity="0.85">
    <animate attributeName="cy" values="22;12;22" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="50" cy="18" r="1" fill="#f97316" opacity="0.9">
    <animate attributeName="cy" values="18;8;18" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="15" cy="46" r="0.7" fill="#ef4444" opacity="0.7"/>
  <circle cx="51" cy="44" r="0.8" fill="#f59e0b" opacity="0.75"/>

  <!-- Capa de pieles de lobo negro y hombreras de hierro remachadas -->
  <path d="M9 64 C10 49, 15 42, 23 41 L32 46 L41 41 C49 42, 54 49, 55 64 Z" fill="#090706"/>
  <path d="M9 64 C12 52, 17 45, 24 43 L20 64 Z" fill="#1c1613"/>
  <path d="M55 64 C52 52, 47 45, 40 43 L44 64 Z" fill="#1c1613"/>

  <!-- Gorjal de placas de hierro negro forjado con remaches macizos -->
  <polygon points="32,46 24,43 27,53 32,56 37,53 40,43" fill="url(#aceroHierroOscuro)" stroke="#090706" stroke-width="0.8"/>
  <circle cx="28" cy="49" r="0.8" fill="#cbd5e1" stroke="#090706" stroke-width="0.3"/>
  <circle cx="36" cy="49" r="0.8" fill="#cbd5e1" stroke="#090706" stroke-width="0.3"/>
  <circle cx="32" cy="52" r="0.8" fill="#cbd5e1" stroke="#090706" stroke-width="0.3"/>

  <!-- Corona de espadas y púas de hierro fundido (Trono de Hierro) -->
  <polygon points="17,17 13,7 21,15" fill="url(#puasEspadas)" stroke="#090706" stroke-width="0.4"/>
  <polygon points="22,15 20,4 26,13" fill="url(#puasEspadas)" stroke="#090706" stroke-width="0.4"/>
  <polygon points="27,13 28,1 32,11" fill="url(#puasEspadas)" stroke="#090706" stroke-width="0.4"/>
  <polygon points="37,13 36,1 32,11" fill="url(#puasEspadas)" stroke="#090706" stroke-width="0.4"/>
  <polygon points="42,15 44,4 38,13" fill="url(#puasEspadas)" stroke="#090706" stroke-width="0.4"/>
  <polygon points="47,17 51,7 43,15" fill="url(#puasEspadas)" stroke="#090706" stroke-width="0.4"/>

  <!-- Yelmo medieval gótico completo de hierro oscuro (Bascinet de placas) -->
  <path d="M18 28 C18 16, 23 13, 32 13 C41 13, 46 16, 46 28 C46 39, 42 45, 32 47 C22 45, 18 39, 18 28 Z" fill="url(#aceroHierroOscuro)" stroke="#090706" stroke-width="1.1"/>

  <!-- Bisel / Nervadura central del yelmo reforzado -->
  <path d="M31 13 L31 46 L33 46 L33 13 Z" fill="#94a3b8" opacity="0.7"/>

  <!-- Banda transversal de refuerzo en la frente -->
  <path d="M19 28 L45 28 L44 32.5 L20 32.5 Z" fill="#1e293b" stroke="#090706" stroke-width="0.6"/>

  <!-- Visor en ranura afilada con fulgor de fuego interior infernal -->
  <rect x="21" y="28.8" width="22" height="2.8" rx="1.2" fill="#050201"/>

  <!-- Resplandor amenazante desde el interior del yelmo ardiente -->
  <g>
    <rect x="23" y="29.2" width="7.5" height="2" rx="0.8" fill="url(#fuegoVisorBrasa)">
      <animate attributeName="opacity" values="0.75;1;0.75" dur="2s" repeatCount="indefinite"/>
    </rect>
    <rect x="33.5" y="29.2" width="7.5" height="2" rx="0.8" fill="url(#fuegoVisorBrasa)">
      <animate attributeName="opacity" values="0.75;1;0.75" dur="2s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Orificios de respiración / ventilación en la barbilla de hierro -->
  <g fill="#090706">
    <circle cx="26" cy="37" r="0.8"/><circle cx="38" cy="37" r="0.8"/>
    <circle cx="25" cy="40" r="0.8"/><circle cx="39" cy="40" r="0.8"/>
    <circle cx="28" cy="40" r="0.8"/><circle cx="36" cy="40" r="0.8"/>
    <circle cx="30" cy="42" r="0.8"/><circle cx="34" cy="42" r="0.8"/>
    <circle cx="27" cy="43" r="0.8"/><circle cx="37" cy="43" r="0.8"/>
  </g>
</svg>
