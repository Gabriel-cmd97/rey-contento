<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="bgHierro" cx="50%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#3a1c13"/>
      <stop offset="60%" stop-color="#190b07"/>
      <stop offset="100%" stop-color="#080302"/>
    </radialGradient>
    <linearGradient id="aceroOscuro" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7f8c8d"/>
      <stop offset="35%" stop-color="#4a555c"/>
      <stop offset="75%" stop-color="#2c3e50"/>
      <stop offset="100%" stop-color="#1a252f"/>
    </linearGradient>
    <linearGradient id="brilloEspada" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bdc3c7"/>
      <stop offset="100%" stop-color="#34495e"/>
    </linearGradient>
    <radialGradient id="brilloVisor" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff793f"/>
      <stop offset="60%" stop-color="#cd6133"/>
      <stop offset="100%" stop-color="#cd6133" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Fondo de forja y ceniza -->
  <circle cx="32" cy="32" r="32" fill="url(#bgHierro)"/>

  <!-- Chispas incandescentes de batalla -->
  <circle cx="14" cy="22" r="0.8" fill="#e67e22" opacity="0.8"/>
  <circle cx="49" cy="18" r="1.1" fill="#f39c12" opacity="0.9"/>
  <circle cx="16" cy="45" r="0.7" fill="#e74c3c" opacity="0.7"/>
  <circle cx="50" cy="42" r="0.8" fill="#f1c40f" opacity="0.8"/>

  <!-- Capa de pieles nórdicas oscuras en los hombros (estilo Poniente) -->
  <path d="M10 64 C11 50, 16 42, 23 41 L32 46 L41 41 C48 42, 53 50, 54 64 Z" fill="#14110f"/>
  <path d="M10 64 C13 52, 18 45, 25 43 L21 64 Z" fill="#26211c"/>
  <path d="M54 64 C51 52, 46 45, 39 43 L43 64 Z" fill="#26211c"/>
  <!-- Gorjal de acero remachado -->
  <polygon points="32,45 25,43 27,51 32,53 37,51 39,43" fill="#2c3e50" stroke="#7f8c8d" stroke-width="0.8"/>
  <circle cx="28" cy="48" r="0.7" fill="#bdc3c7"/>
  <circle cx="36" cy="48" r="0.7" fill="#bdc3c7"/>

  <!-- Corona de púas de hierro forjado / Trono de Espadas -->
  <polygon points="18,17 14,8 21,15" fill="url(#brilloEspada)"/>
  <polygon points="23,15 21,5 26,13" fill="url(#brilloEspada)"/>
  <polygon points="28,13 28,3 32,11" fill="url(#brilloEspada)"/>
  <polygon points="36,13 36,3 32,11" fill="url(#brilloEspada)"/>
  <polygon points="41,15 43,5 38,13" fill="url(#brilloEspada)"/>
  <polygon points="46,17 50,8 43,15" fill="url(#brilloEspada)"/>

  <!-- Yelmo medieval gótico completo de hierro oscuro -->
  <path d="M19 28 C19 16, 23 13, 32 13 C41 13, 45 16, 45 28 C45 38, 41 44, 32 46 C23 44, 19 38, 19 28 Z" fill="url(#aceroOscuro)" stroke="#1a252f" stroke-width="1"/>
  <!-- Cresta central de acero templado -->
  <path d="M31 13 L31 45 L33 45 L33 13 Z" fill="#7f8c8d"/>

  <!-- Refuerzo frontal en cruz -->
  <path d="M20 28 L44 28 L43 32 L21 32 Z" fill="#1b2631"/>

  <!-- Visor en ranura afilada con fulgor de fuego interior -->
  <rect x="22" y="29" width="20" height="2.5" rx="1.2" fill="#0d0402"/>
  <!-- Resplandor amenazante desde el interior del yelmo -->
  <g>
    <rect x="24" y="29.2" width="6" height="2" rx="1" fill="#ff793f">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="2.4s" repeatCount="indefinite"/>
    </rect>
    <rect x="34" y="29.2" width="6" height="2" rx="1" fill="#ff793f">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="2.4s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Orificios de ventilación / respiración en la babera medieval -->
  <g fill="#111820">
    <circle cx="27" cy="37" r="0.8"/><circle cx="37" cy="37" r="0.8"/>
    <circle cx="26" cy="40" r="0.8"/><circle cx="38" cy="40" r="0.8"/>
    <circle cx="28" cy="40" r="0.8"/><circle cx="36" cy="40" r="0.8"/>
    <circle cx="30" cy="42" r="0.8"/><circle cx="34" cy="42" r="0.8"/>
  </g>
</svg>
