<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="bgCaballeroPaladin" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#243447"/>
      <stop offset="55%" stop-color="#121b24"/>
      <stop offset="100%" stop-color="#05080c"/>
    </radialGradient>
    <linearGradient id="aceroPuro" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#e2e8f0"/>
      <stop offset="55%" stop-color="#94a3b8"/>
      <stop offset="80%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="aceroSombra" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="60%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="oroCruzReal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff9c4"/>
      <stop offset="30%" stop-color="#fbc02d"/>
      <stop offset="70%" stop-color="#d4ac0d"/>
      <stop offset="90%" stop-color="#9a7d0a"/>
      <stop offset="100%" stop-color="#564504"/>
    </linearGradient>
    <linearGradient id="penachoCarmesí" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#500707"/>
      <stop offset="35%" stop-color="#991b1b"/>
      <stop offset="70%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#f87171"/>
    </linearGradient>
    <radialGradient id="auraValor" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#fef08a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Fondo de baluarte medieval -->
  <circle cx="32" cy="32" r="32" fill="url(#bgCaballeroPaladin)"/>

  <!-- Resplandor heróico de honor -->
  <circle cx="32" cy="28" r="22" fill="url(#auraValor)">
    <animate attributeName="opacity" values="0.7;1;0.7" dur="2.8s" repeatCount="indefinite"/>
  </circle>

  <!-- Chispas doradas de la forja real -->
  <circle cx="14" cy="20" r="0.8" fill="#fde047" opacity="0.8">
    <animate attributeName="cy" values="20;12;20" dur="2.3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="50" cy="18" r="0.7" fill="#fde047" opacity="0.75">
    <animate attributeName="cy" values="18;10;18" dur="2.7s" repeatCount="indefinite"/>
  </circle>
  <circle cx="52" cy="44" r="0.6" fill="#cbd5e1" opacity="0.6"/>

  <!-- Plumas / Gran penacho ondeante de la orden del Rey -->
  <path d="M30 16 C34 4, 46 2, 54 6 C48 9, 44 11, 38 17 Z" fill="#7f1d1d"/>
  <path d="M32 15 C37 6, 48 4, 53 9 C47 12, 42 14, 35 18 Z" fill="url(#penachoCarmesí)"/>
  <path d="M28 17 C32 8, 41 7, 47 11 C42 13, 37 15, 31 19 Z" fill="#ef4444"/>
  <!-- Hilos de pluma y brillo -->
  <path d="M33 13 Q43 7 50 8" stroke="#fca5a5" stroke-width="0.6" fill="none" opacity="0.8"/>
  <path d="M30 16 Q39 10 45 12" stroke="#fca5a5" stroke-width="0.5" fill="none" opacity="0.7"/>

  <!-- Hombreras masivas, sobreveste y cota de malla -->
  <!-- Capa interior oscura -->
  <path d="M10 64 C11 50, 16 43, 23 41 L32 46 L41 41 C48 43, 53 50, 54 64 Z" fill="#0f172a"/>
  <!-- Cota de malla anillada en el cuello -->
  <path d="M22 41 C22 47, 26 53, 32 55 C38 53, 42 47, 42 41 Z" fill="#334155"/>
  <!-- Patrón de anillas -->
  <path d="M24 45 Q32 49 40 45 M25 48 Q32 52 39 48 M27 51 Q32 54 37 51" stroke="#64748b" stroke-width="0.8" fill="none"/>

  <!-- Hombreras de acero pulido (Pauldrons) con reborde de oro -->
  <path d="M8 64 C9 53, 14 44, 23 42 L22 55 L16 64 Z" fill="url(#aceroPuro)" stroke="#0f172a" stroke-width="0.6"/>
  <path d="M56 64 C55 53, 50 44, 41 42 L42 55 L48 64 Z" fill="url(#aceroSombra)" stroke="#0f172a" stroke-width="0.6"/>
  <path d="M12 47 Q17 44 23 42" stroke="url(#oroCruzReal)" stroke-width="1.2" fill="none"/>
  <path d="M52 47 Q47 44 41 42" stroke="url(#oroCruzReal)" stroke-width="1.2" fill="none"/>

  <!-- Gorjal de pecho con relieve de blasón real -->
  <polygon points="32,46 25,43 28,54 32,58 36,54 39,43" fill="url(#aceroPuro)" stroke="#1e293b" stroke-width="0.7"/>
  <polygon points="32,48 27,45 29,53 32,56 35,53 37,45" fill="url(#oroCruzReal)"/>
  <polygon points="32,50 30,52 32,54 34,52" fill="#7f1d1d"/>

  <!-- Gran Yelmo de Caballero Paladín (Sugarloaf Helm) -->
  <!-- Silueta del yelmo cónico aerodinámico -->
  <path d="M19 28 C19 15, 24 12, 32 11 C40 12, 45 15, 45 28 C45 39, 41 46, 32 48 C23 46, 19 39, 19 28 Z" fill="url(#aceroPuro)" stroke="#0f172a" stroke-width="0.9"/>

  <!-- Bisel / Faceta de sombra en el lateral derecho para tridimensionalidad -->
  <path d="M32 11 C38 12, 45 15, 45 28 C45 39, 41 46, 32 48 L32 11 Z" fill="#000000" opacity="0.18"/>

  <!-- Refuerzo frontal en Cruz de la Orden en oro repujado (Bisel 3D) -->
  <!-- Brazo vertical de la cruz -->
  <path d="M30 11.5 L34 11.5 L33.5 47.5 L30.5 47.5 Z" fill="url(#oroCruzReal)" stroke="#785002" stroke-width="0.5"/>
  <line x1="32" y1="12" x2="32" y2="47" stroke="#fff9c4" stroke-width="0.8"/>

  <!-- Brazo horizontal de la cruz que enmarca el visor -->
  <path d="M19.5 27 L44.5 27 L44 32.5 L20 32.5 Z" fill="url(#oroCruzReal)" stroke="#785002" stroke-width="0.5"/>
  <line x1="20" y1="28" x2="44" y2="28" stroke="#fff9c4" stroke-width="0.7"/>
  <line x1="20" y1="31.8" x2="44" y2="31.8" stroke="#564504" stroke-width="0.6"/>

  <!-- Hendidura del visor templario (Oculares oscuros con mirada vigilante) -->
  <rect x="21" y="28.5" width="9.2" height="2.2" rx="0.5" fill="#05080c"/>
  <rect x="33.8" y="28.5" width="9.2" height="2.2" rx="0.5" fill="#05080c"/>
  <!-- Fulgor de ojos audaces dentro del visor -->
  <circle cx="26" cy="29.6" r="0.6" fill="#fde047" opacity="0.9"/>
  <circle cx="38" cy="29.6" r="0.6" fill="#fde047" opacity="0.9"/>

  <!-- Remaches de forja en oro y acero -->
  <circle cx="22" cy="20" r="0.8" fill="#f8fafc" stroke="#334155" stroke-width="0.3"/>
  <circle cx="42" cy="20" r="0.8" fill="#cbd5e1" stroke="#334155" stroke-width="0.3"/>
  <circle cx="22" cy="39" r="0.8" fill="#f8fafc" stroke="#334155" stroke-width="0.3"/>
  <circle cx="42" cy="39" r="0.8" fill="#cbd5e1" stroke="#334155" stroke-width="0.3"/>
  <!-- Remaches en la cruz dorada -->
  <circle cx="32" cy="14" r="0.6" fill="#fff9c4"/>
  <circle cx="32" cy="24" r="0.6" fill="#fff9c4"/>
  <circle cx="32" cy="35" r="0.6" fill="#fff9c4"/>
  <circle cx="32" cy="44" r="0.6" fill="#fff9c4"/>

  <!-- Respiraderos de diseño floral heráldico en la placa frontal inferior -->
  <g fill="#0f172a">
    <!-- Lado izquierdo -->
    <circle cx="25.5" cy="36" r="0.6"/><circle cx="28" cy="36" r="0.6"/>
    <circle cx="24.5" cy="38.5" r="0.6"/><circle cx="27" cy="38.5" r="0.6"/><circle cx="29.5" cy="38.5" r="0.6"/>
    <circle cx="25.5" cy="41" r="0.6"/><circle cx="28" cy="41" r="0.6"/>
    <circle cx="27" cy="43.5" r="0.6"/>
    <!-- Lado derecho -->
    <circle cx="36" cy="36" r="0.6"/><circle cx="38.5" cy="36" r="0.6"/>
    <circle cx="34.5" cy="38.5" r="0.6"/><circle cx="37" cy="38.5" r="0.6"/><circle cx="39.5" cy="38.5" r="0.6"/>
    <circle cx="36" cy="41" r="0.6"/><circle cx="38.5" cy="41" r="0.6"/>
    <circle cx="37" cy="43.5" r="0.6"/>
  </g>
</svg>
