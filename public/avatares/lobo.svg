<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="bgLoboBeast" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#142c44"/>
      <stop offset="60%" stop-color="#091726"/>
      <stop offset="100%" stop-color="#020810"/>
    </radialGradient>
    <linearGradient id="pelajeLoboFeroz" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="35%" stop-color="#cbd5e1"/>
      <stop offset="70%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="sombraMane" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <radialGradient id="ojoLoboFeroz" cx="45%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#fff9c4"/>
      <stop offset="35%" stop-color="#fbc02d"/>
      <stop offset="75%" stop-color="#f57f17"/>
      <stop offset="100%" stop-color="#bf360c"/>
    </radialGradient>
    <linearGradient id="faucesInterior" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a0808"/>
      <stop offset="100%" stop-color="#150202"/>
    </linearGradient>
  </defs>

  <!-- Fondo de páramo invernal ártico -->
  <circle cx="32" cy="32" r="32" fill="url(#bgLoboBeast)"/>

  <!-- Bruma gélida / resplandor de luna detrás -->
  <circle cx="32" cy="22" r="22" fill="#93c5fd" opacity="0.12">
    <animate attributeName="opacity" values="0.08;0.18;0.08" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- Copos de nieve y ventisca -->
  <circle cx="12" cy="16" r="0.8" fill="#ffffff" opacity="0.85">
    <animate attributeName="cy" values="16;28;16" dur="2.4s" repeatCount="indefinite"/>
    <animate attributeName="cx" values="12;9;12" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="52" cy="12" r="0.9" fill="#e2e8f0" opacity="0.8">
    <animate attributeName="cy" values="12;24;12" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="54" cy="46" r="0.7" fill="#ffffff" opacity="0.7"/>
  <circle cx="10" cy="48" r="0.6" fill="#cbd5e1" opacity="0.6"/>

  <!-- Melena y pelaje espeso del cuello (mechones salvajes de lobo huargo) -->
  <path d="M14 64 L16 52 L11 48 L18 42 L13 36 L21 32 L26 36 L32 30 L38 36 L43 32 L51 36 L46 42 L53 48 L48 52 L50 64 Z" fill="url(#sombraMane)"/>
  <path d="M18 64 L20 54 L15 50 L22 45 L26 64 Z" fill="#0f172a"/>
  <path d="M46 64 L44 54 L49 50 L42 45 L38 64 Z" fill="#0f172a"/>

  <!-- Orejas puntiagudas de lobo erectas hacia el acecho -->
  <!-- Oreja izquierda -->
  <polygon points="18,24 10,6 25,17" fill="#334155" stroke="#0f172a" stroke-width="0.8"/>
  <polygon points="17,21 12,9 23,17" fill="#e2e8f0"/>
  <polygon points="17,20 14,12 21,17" fill="#f8fafc"/>
  <!-- Mechones en la base de la oreja izquierda -->
  <polygon points="14,24 8,26 15,28" fill="#475569"/>

  <!-- Oreja derecha -->
  <polygon points="46,24 54,6 39,17" fill="#334155" stroke="#0f172a" stroke-width="0.8"/>
  <polygon points="47,21 52,9 41,17" fill="#e2e8f0"/>
  <polygon points="47,20 50,12 43,17" fill="#f8fafc"/>
  <!-- Mechones en la base de la oreja derecha -->
  <polygon points="50,24 56,26 49,28" fill="#475569"/>

  <!-- Cabeza de Lobo Huargo (Geometría canina con mandíbula angulosa) -->
  <path d="M22 18 C26 16, 38 16, 42 18 C46 22, 51 28, 54 34 L47 36 L52 42 L44 44 L41 50 L32 54 L23 50 L20 44 L12 42 L17 36 L10 34 C13 28, 18 22, 22 18 Z" fill="url(#pelajeLoboFeroz)" stroke="#1e293b" stroke-width="0.8"/>

  <!-- Mechones laterales de las mejillas (ruff canino) -->
  <polygon points="12,34 6,38 14,40" fill="#94a3b8"/>
  <polygon points="13,41 7,45 15,46" fill="#64748b"/>
  <polygon points="52,34 58,38 50,40" fill="#94a3b8"/>
  <polygon points="51,41 57,45 49,46" fill="#64748b"/>

  <!-- Frente y puente del hocico canino -->
  <path d="M26 19 C28 24, 30 28, 28 35 L32 38 L36 35 C34 28, 36 24, 38 19 Z" fill="#64748b" opacity="0.4"/>
  <polygon points="32,23 30,34 34,34" fill="#334155" opacity="0.6"/>

  <!-- Arrugas de furia y gruñido en el hocico (ceño fruncido de fiera) -->
  <path d="M29 32 Q32 30 35 32" stroke="#1e293b" stroke-width="1" fill="none"/>
  <path d="M28 34 Q32 32 36 34" stroke="#1e293b" stroke-width="1" fill="none"/>
  <path d="M27 36 Q32 34 37 36" stroke="#1e293b" stroke-width="1" fill="none"/>

  <!-- Ojos depredadores rasgados e intensos de Lobo (amarillo/ámbar gélido) -->
  <!-- Cejas amenazantes inclinadas -->
  <path d="M20 22 L28 25 L27 27 L19 24 Z" fill="#0f172a"/>
  <path d="M44 22 L36 25 L37 27 L45 24 Z" fill="#0f172a"/>

  <!-- Ojo izquierdo rasgado -->
  <path d="M20 24 Q24 23 28 26 Q24 28 20 24 Z" fill="#090d13"/>
  <ellipse cx="24" cy="25" rx="2.4" ry="1.6" fill="url(#ojoLoboFeroz)" transform="rotate(-10 24 25)"/>
  <circle cx="24" cy="25" r="0.9" fill="#090d13"/>
  <circle cx="24.4" cy="24.5" r="0.4" fill="#ffffff"/>

  <!-- Ojo derecho rasgado -->
  <path d="M44 24 Q40 23 36 26 Q40 28 44 24 Z" fill="#090d13"/>
  <ellipse cx="40" cy="25" rx="2.4" ry="1.6" fill="url(#ojoLoboFeroz)" transform="rotate(10 40 25)"/>
  <circle cx="40" cy="25" r="0.9" fill="#090d13"/>
  <circle cx="39.6" cy="24.5" r="0.4" fill="#ffffff"/>

  <!-- Trufa / Nariz canina de lobo prominente -->
  <path d="M28 38 C28 37, 36 37, 36 38 C36 41, 34 43, 32 43 C30 43, 28 41, 28 38 Z" fill="#090d13"/>
  <!-- Fosas nasales -->
  <ellipse cx="29.8" cy="40" rx="0.8" ry="0.6" fill="#1e293b"/>
  <ellipse cx="34.2" cy="40" rx="0.8" ry="0.6" fill="#1e293b"/>
  <path d="M32 40 L32 43" stroke="#1e293b" stroke-width="0.8"/>

  <!-- Fauces abiertas y gruñido con colmillos al descubierto -->
  <!-- Cavidad de la boca abierta -->
  <path d="M25 43 Q32 44 39 43 Q37 51 32 52 Q27 51 25 43 Z" fill="url(#faucesInterior)"/>
  <!-- Lengua oscura en la profundidad -->
  <ellipse cx="32" cy="49" rx="3.5" ry="2" fill="#78281f"/>

  <!-- Encías superiores fruncidas -->
  <path d="M25 42 Q32 43 39 42" stroke="#501814" stroke-width="1.2" fill="none"/>

  <!-- Colmillos superiores afilados (fauces de fiera) -->
  <polygon points="26,42 24.5,48 27.5,44" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.3"/>
  <polygon points="38,42 39.5,48 36.5,44" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.3"/>
  <!-- Incisivos intermedios -->
  <polygon points="28.5,42.5 28,45 29.5,43" fill="#f8fafc"/>
  <polygon points="30.5,42.8 30.5,45.2 31.5,43" fill="#f8fafc"/>
  <polygon points="32.5,42.8 32.5,45.2 33.5,43" fill="#f8fafc"/>
  <polygon points="34.5,42.5 35,45 35.5,43" fill="#f8fafc"/>

  <!-- Colmillos inferiores cruzando la mordida -->
  <polygon points="25.5,50 25,45 27,48" fill="#ffffff"/>
  <polygon points="38.5,50 39,45 37,48" fill="#ffffff"/>

  <!-- Mandíbula inferior y barbilla con pelaje hirsuto -->
  <path d="M26 49 C28 53, 36 53, 38 49 L37 53 C35 55, 29 55, 27 53 Z" fill="#64748b"/>
</svg>
