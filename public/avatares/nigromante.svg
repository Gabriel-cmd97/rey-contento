<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="bgNigro" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#2d113f"/>
      <stop offset="60%" stop-color="#14061e"/>
      <stop offset="100%" stop-color="#07020b"/>
    </radialGradient>
    <linearGradient id="oroNigro" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffe875"/>
      <stop offset="45%" stop-color="#f4d03f"/>
      <stop offset="85%" stop-color="#9a7d0a"/>
      <stop offset="100%" stop-color="#564205"/>
    </linearGradient>
    <linearGradient id="hueso" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#e2e6ea"/>
      <stop offset="100%" stop-color="#9aa0a6"/>
    </linearGradient>
    <radialGradient id="fuegoOjo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff4d4d"/>
      <stop offset="45%" stop-color="#e74c3c"/>
      <stop offset="80%" stop-color="#922b21"/>
      <stop offset="100%" stop-color="#922b21" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="haloNigro" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a569bd" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#5b2c6f" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Fondo abisal -->
  <circle cx="32" cy="32" r="32" fill="url(#bgNigro)"/>

  <!-- Halo de nigromancia pulsante -->
  <circle cx="32" cy="32" r="28" fill="url(#haloNigro)">
    <animate attributeName="r" values="24;28;24" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;1;0.6" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- Círculo rúnico arcano sutil -->
  <circle cx="32" cy="32" r="27" fill="none" stroke="#7d3c98" stroke-width="0.75" stroke-dasharray="2,3" opacity="0.65"/>
  <circle cx="32" cy="32" r="29.5" fill="none" stroke="#a569bd" stroke-width="0.5" stroke-dasharray="5,2" opacity="0.45"/>

  <!-- Manto real imperial de terciopelo y hombreras de obsidiana -->
  <path d="M10 64 C12 50, 18 44, 25 43 L32 50 L39 43 C46 44, 52 50, 54 64 Z" fill="#1b0826"/>
  <path d="M10 64 C12 50, 18 44, 25 43 L28 47 L23 64 Z" fill="#2d0f3e"/>
  <path d="M54 64 C52 50, 46 44, 39 43 L36 47 L41 64 Z" fill="#2d0f3e"/>
  <!-- Broche y cuello con gemas de rubí -->
  <path d="M25 43 L32 49 L39 43 L32 39 Z" fill="url(#oroNigro)"/>
  <circle cx="32" cy="44" r="2" fill="#c0392b" stroke="#f4d03f" stroke-width="0.5"/>

  <!-- Hombreras de hueso y oro con cuernos -->
  <path d="M10 49 C7 44, 9 39, 13 41 C11 44, 14 47, 18 48 Z" fill="url(#oroNigro)"/>
  <path d="M54 49 C57 44, 55 39, 51 41 C53 44, 50 47, 46 48 Z" fill="url(#oroNigro)"/>

  <!-- Cráneo majestuoso -->
  <path d="M19 28 C19 18, 24 15, 32 15 C40 15, 45 18, 45 28 C45 34, 43 38, 39 40 C39 43, 37 45, 37 46 L27 46 C27 45, 25 43, 25 40 C21 38, 19 34, 19 28 Z" fill="url(#hueso)"/>
  <!-- Pómulos y sombras craneales -->
  <path d="M21 33 C23 37, 26 39, 27 44 L25 44 C23 41, 20 37, 20 33 Z" fill="#7f8c8d" opacity="0.6"/>
  <path d="M43 33 C41 37, 38 39, 37 44 L39 44 C41 41, 44 37, 44 33 Z" fill="#7f8c8d" opacity="0.6"/>
  <!-- Cavidad nasal gótica -->
  <polygon points="32,36 30,40 34,40" fill="#0b0610"/>

  <!-- Dientes siniestros -->
  <rect x="28" y="44" width="1.5" height="2" fill="#1b0826"/>
  <rect x="30.5" y="44" width="1.5" height="2.5" fill="#1b0826"/>
  <rect x="33" y="44" width="1.5" height="2" fill="#1b0826"/>
  <rect x="35.5" y="44" width="1.5" height="2" fill="#1b0826"/>

  <!-- Cuencas oculares profundas y amenazantes -->
  <path d="M23 27 C23 23, 29 23, 29 28 C29 32, 24 33, 23 27 Z" fill="#07020a"/>
  <path d="M41 27 C41 23, 35 23, 35 28 C35 32, 40 33, 41 27 Z" fill="#07020a"/>

  <!-- Llamas de alma carmesí en los ojos (Overlord / Nazarick) animadas -->
  <g>
    <circle cx="26" cy="28" r="2.5" fill="url(#fuegoOjo)">
      <animate attributeName="r" values="2;3.2;2" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="26" cy="28" r="1.1" fill="#fff5f5">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="38" cy="28" r="2.5" fill="url(#fuegoOjo)">
      <animate attributeName="r" values="3.2;2;3.2" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="38" cy="28" r="1.1" fill="#fff5f5">
      <animate attributeName="opacity" values="1;0.7;1" dur="1.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Gran Corona Imperial de Overlord con rubíes y picos afilados -->
  <path d="M17 19 L21 11 L25 17 L32 7 L39 17 L43 11 L47 19 L46 22 L18 22 Z" fill="url(#oroNigro)" stroke="#7d6608" stroke-width="0.5"/>
  <path d="M18 21 L46 21 L45 23 L19 23 Z" fill="#564205"/>
  <!-- Rubí central imperial -->
  <polygon points="32,11 34.5,14 32,17 29.5,14" fill="#e74c3c" stroke="#f4d03f" stroke-width="0.5">
    <animate attributeName="fill" values="#e74c3c;#ff7675;#c0392b;#e74c3c" dur="2s" repeatCount="indefinite"/>
  </polygon>
  <!-- Rubíes laterales -->
  <circle cx="21" cy="14" r="1.3" fill="#c0392b"/>
  <circle cx="43" cy="14" r="1.3" fill="#c0392b"/>
  <circle cx="25" cy="19" r="1" fill="#c0392b"/>
  <circle cx="39" cy="19" r="1" fill="#c0392b"/>
</svg>
