<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <!-- Fondo abisal nigromántico (Verde vil/Muerte) -->
    <radialGradient id="bgHuesos" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#0b2e21"/>
      <stop offset="60%" stop-color="#041410"/>
      <stop offset="100%" stop-color="#010604"/>
    </radialGradient>
    
    <linearGradient id="huesoAntiguo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fdfbf7"/>
      <stop offset="40%" stop-color="#e3dfd3"/>
      <stop offset="70%" stop-color="#b8b2a3"/>
      <stop offset="100%" stop-color="#7a7566"/>
    </linearGradient>

    <linearGradient id="huesoOscuro" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b8b2a3"/>
      <stop offset="100%" stop-color="#4a473c"/>
    </linearGradient>

    <radialGradient id="ojoFantasma" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a7f3d0"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <circle cx="32" cy="32" r="32" fill="url(#bgHuesos)"/>

  <!-- Aura necrótica animada -->
  <circle cx="32" cy="32" r="28" fill="#10b981" opacity="0.15">
    <animate attributeName="r" values="26;30;26" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.1;0.25;0.1" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- Manto andrajoso oscuro -->
  <path d="M8 64 C10 44, 20 38, 32 38 C44 38, 54 44, 56 64 Z" fill="#0d1117"/>
  <path d="M14 64 C16 48, 22 42, 32 42 C42 42, 48 48, 50 64 Z" fill="#161b22"/>

  <!-- Armadura de Huesos Entrelazados (Caja Torácica) -->
  <!-- Costilla 1 -->
  <path d="M32 48 C24 46, 18 52, 14 56 C20 54, 26 50, 32 50 C38 50, 44 54, 50 56 C46 52, 40 46, 32 48 Z" fill="url(#huesoAntiguo)"/>
  <!-- Costilla 2 -->
  <path d="M32 54 C24 52, 16 58, 12 62 C18 60, 26 56, 32 56 C38 56, 46 60, 52 62 C48 58, 40 52, 32 54 Z" fill="url(#huesoAntiguo)"/>
  <!-- Esternón -->
  <polygon points="30,46 34,46 33,64 31,64" fill="url(#huesoOscuro)"/>

  <!-- Hombreras de cráneos pequeños -->
  <circle cx="16" cy="46" r="4" fill="url(#huesoAntiguo)"/>
  <polygon points="14,48 18,48 17,52 15,52" fill="url(#huesoAntiguo)"/>
  <circle cx="15" cy="45" r="0.8" fill="#010409"/>
  <circle cx="17" cy="45" r="0.8" fill="#010409"/>

  <circle cx="48" cy="46" r="4" fill="url(#huesoAntiguo)"/>
  <polygon points="46,48 50,48 49,52 47,52" fill="url(#huesoAntiguo)"/>
  <circle cx="47" cy="45" r="0.8" fill="#010409"/>
  <circle cx="49" cy="45" r="0.8" fill="#010409"/>

  <!-- Capucha Profunda -->
  <path d="M12 32 C12 10, 22 4, 32 4 C42 4, 52 10, 52 32 C52 44, 46 48, 32 48 C18 48, 12 44, 12 32 Z" fill="#0d1117"/>
  <path d="M18 32 C18 14, 24 8, 32 8 C40 8, 46 14, 46 32 C46 40, 42 44, 32 44 C22 44, 18 40, 18 32 Z" fill="#010409"/>

  <!-- Casco/Máscara de bestia huesuda (Rattleshirt style) -->
  <!-- Cráneo base -->
  <path d="M22 28 C22 18, 26 14, 32 14 C38 14, 42 18, 42 28 C42 34, 38 38, 36 38 C34 38, 34 40, 34 42 L30 42 C30 40, 30 38, 28 38 C26 38, 22 34, 22 28 Z" fill="url(#huesoAntiguo)"/>
  
  <!-- Cuernos del casco imponentes -->
  <path d="M23 18 C16 8, 6 12, 4 20 C6 16, 14 14, 21 22 Z" fill="url(#huesoAntiguo)" stroke="#3f3f46" stroke-width="0.5"/>
  <path d="M41 18 C48 8, 58 12, 60 20 C58 16, 50 14, 43 22 Z" fill="url(#huesoAntiguo)" stroke="#3f3f46" stroke-width="0.5"/>
  <!-- Cuernos inferiores -->
  <path d="M22 26 C14 26, 8 32, 6 38 C10 32, 16 30, 22 32 Z" fill="url(#huesoAntiguo)" stroke="#3f3f46" stroke-width="0.5"/>
  <path d="M42 26 C50 26, 56 32, 58 38 C54 32, 48 30, 42 32 Z" fill="url(#huesoAntiguo)" stroke="#3f3f46" stroke-width="0.5"/>

  <!-- Sombras pómulos -->
  <path d="M24 30 C26 34, 28 36, 28 38 L24 36 Z" fill="#7a7566" opacity="0.8"/>
  <path d="M40 30 C38 34, 36 36, 36 38 L40 36 Z" fill="#7a7566" opacity="0.8"/>

  <!-- Ojos profundos y fuego fiero -->
  <polygon points="24,26 30,24 28,30" fill="#010409"/>
  <polygon points="40,26 34,24 36,30" fill="#010409"/>
  
  <!-- Fuego en los ojos -->
  <g>
    <circle cx="27" cy="27" r="2.5" fill="url(#ojoFantasma)">
      <animate attributeName="r" values="2;3.5;2" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="27" cy="27" r="0.8" fill="#ffffff"/>

    <circle cx="37" cy="27" r="2.5" fill="url(#ojoFantasma)">
      <animate attributeName="r" values="3.5;2;3.5" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="37" cy="27" r="0.8" fill="#ffffff"/>
  </g>

  <!-- Nariz bestial hueca -->
  <polygon points="32,30 30,35 34,35" fill="#010409"/>

  <!-- Mandíbula y dientes afilados (fauces de bestia) -->
  <!-- Sombra interior boca -->
  <path d="M26 38 C30 36, 34 36, 38 38 L36 44 L28 44 Z" fill="#010409"/>
  <!-- Base mandíbula inferior -->
  <path d="M26 42 C30 46, 34 46, 38 42 L36 46 L28 46 Z" fill="url(#huesoAntiguo)"/>
  
  <!-- Colmillos largos superiores -->
  <polygon points="27,38 26,44 28,39" fill="#fdfbf7"/>
  <polygon points="37,38 38,44 36,39" fill="#fdfbf7"/>
  <!-- Dientes intermedios -->
  <polygon points="29,38 28.5,41 30,38.5" fill="#fdfbf7"/>
  <polygon points="31,38 30.5,40 31.5,38.5" fill="#fdfbf7"/>
  <polygon points="33,38 32.5,40 33.5,38.5" fill="#fdfbf7"/>
  <polygon points="35,38 34.5,41 35.5,38.5" fill="#fdfbf7"/>

  <!-- Colmillos inferiores -->
  <polygon points="28,45 28.5,40 29.5,44" fill="#e3dfd3"/>
  <polygon points="36,45 35.5,40 34.5,44" fill="#e3dfd3"/>
</svg>
