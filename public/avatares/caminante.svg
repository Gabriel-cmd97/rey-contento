<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <!-- Fondo: Abismo polar de la Larga Noche -->
    <radialGradient id="bgReyNoche" cx="50%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#0a233a"/>
      <stop offset="45%" stop-color="#051524"/>
      <stop offset="80%" stop-color="#020a12"/>
      <stop offset="100%" stop-color="#000408"/>
    </radialGradient>

    <!-- Piel glacial del Rey de la Noche: pálida, antigua y esculpida en hielo -->
    <linearGradient id="pielReyNoche" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0f9ff"/>
      <stop offset="35%" stop-color="#cbe5f5"/>
      <stop offset="70%" stop-color="#8bb7d6"/>
      <stop offset="100%" stop-color="#5582a3"/>
    </linearGradient>

    <!-- Faceta iluminada de los cuernos de hielo / corona de cristal -->
    <linearGradient id="cuernoLuz" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#bbf2f6"/>
      <stop offset="65%" stop-color="#56ccf2"/>
      <stop offset="100%" stop-color="#2f80ed"/>
    </linearGradient>

    <!-- Faceta en sombra / refracción profunda de los cuernos de hielo -->
    <linearGradient id="cuernoSombra" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2f80ed"/>
      <stop offset="45%" stop-color="#144b7a"/>
      <stop offset="85%" stop-color="#092742"/>
      <stop offset="100%" stop-color="#041321"/>
    </linearGradient>

    <!-- Armadura de cuero oscuro y placas de obsidiana ancestral -->
    <linearGradient id="obsidianaPlacas" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2c3e50"/>
      <stop offset="35%" stop-color="#182533"/>
      <stop offset="75%" stop-color="#0c141d"/>
      <stop offset="100%" stop-color="#04070a"/>
    </linearGradient>

    <!-- Ojo de zafiro estelar con fulgor penetrante -->
    <radialGradient id="ojoReyZafiro" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#00f5ff"/>
      <stop offset="60%" stop-color="#0088e0"/>
      <stop offset="85%" stop-color="#003d73"/>
      <stop offset="100%" stop-color="#001830"/>
    </radialGradient>

    <!-- Resplandor glacial envolvente de ventisca -->
    <radialGradient id="auraVentisca" cx="50%" cy="38%" r="55%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.32"/>
      <stop offset="50%" stop-color="#0077c2" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#001a33" stop-opacity="0"/>
    </radialGradient>

    <!-- Brillo del broche rúnico pectoral -->
    <radialGradient id="gemaRunica" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#00f5ff"/>
      <stop offset="80%" stop-color="#0984e3"/>
      <stop offset="100%" stop-color="#073b64"/>
    </radialGradient>
  </defs>

  <!-- Base circular -->
  <circle cx="32" cy="32" r="32" fill="url(#bgReyNoche)"/>

  <!-- Halo de ventisca y aurora glacial pulsante -->
  <circle cx="32" cy="30" r="28" fill="url(#auraVentisca)">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="2.6s" repeatCount="indefinite"/>
  </circle>

  <!-- Partículas de hielo y ventisca en suspensión animadas -->
  <circle cx="12" cy="20" r="0.8" fill="#d4f6ff" opacity="0.8">
    <animate attributeName="cy" values="24;14;24" dur="2.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.4;0.9;0.4" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="52" cy="18" r="1" fill="#00ffff" opacity="0.75">
    <animate attributeName="cy" values="22;12;22" dur="2.1s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;1;0.5" dur="2.1s" repeatCount="indefinite"/>
  </circle>
  <circle cx="15" cy="46" r="0.7" fill="#88d8f7" opacity="0.7">
    <animate attributeName="cy" values="49;41;49" dur="1.9s" repeatCount="indefinite"/>
  </circle>
  <circle cx="49" cy="48" r="0.9" fill="#e0f7fa" opacity="0.85">
    <animate attributeName="cy" values="51;43;51" dur="2.7s" repeatCount="indefinite"/>
  </circle>
  <!-- Destellos de escarcha estelares -->
  <path d="M48 29 L50 29 M49 28 L49 30" stroke="#ffffff" stroke-width="0.6" opacity="0.75">
    <animate attributeName="opacity" values="0.2;0.85;0.2" dur="1.8s" repeatCount="indefinite"/>
  </path>
  <path d="M14 34 L16 34 M15 33 L15 35" stroke="#70d6ff" stroke-width="0.6" opacity="0.65">
    <animate attributeName="opacity" values="0.75;0.2;0.75" dur="2.2s" repeatCount="indefinite"/>
  </path>

  <!-- Pieles árticas y manto de tormenta en la base -->
  <path d="M8 64 C9 50, 16 42, 24 41 L32 46 L40 41 C48 42, 55 50, 56 64 Z" fill="#081017"/>
  <path d="M9 64 C12 52, 17 44, 25 43 L21 64 Z" fill="#132332"/>
  <path d="M55 64 C52 52, 47 44, 39 43 L43 64 Z" fill="#132332"/>

  <!-- Hombreras de placas de obsidiana con remaches -->
  <path d="M11 64 C12 51, 18 43, 26 42 L32 47 L38 42 C46 43, 52 51, 53 64 Z" fill="url(#obsidianaPlacas)" stroke="#060c13" stroke-width="0.7"/>

  <!-- Púas de cristal de hielo en las hombreras -->
  <polygon points="11,51 6,42 16,47" fill="url(#cuernoLuz)" stroke="#092742" stroke-width="0.4"/>
  <polygon points="11,51 16,47 14,56" fill="url(#cuernoSombra)" stroke="#092742" stroke-width="0.4"/>
  <polygon points="53,51 58,42 48,47" fill="url(#cuernoLuz)" stroke="#092742" stroke-width="0.4"/>
  <polygon points="53,51 48,47 50,56" fill="url(#cuernoSombra)" stroke="#092742" stroke-width="0.4"/>

  <!-- Gorjal / Cuello de placas de acero valyrio helado con remaches -->
  <polygon points="32,45 25,43 27,52 32,54 37,52 39,43" fill="#101e2b" stroke="#2c4760" stroke-width="0.6"/>
  <!-- Broche rúnico glacial en el pecho -->
  <polygon points="32,47 29.5,50.5 32,53 34.5,50.5" fill="url(#gemaRunica)" stroke="#bbf2f6" stroke-width="0.4">
    <animate attributeName="opacity" values="0.75;1;0.75" dur="2.1s" repeatCount="indefinite"/>
  </polygon>

  <!-- Cuello y tendones ancestrales -->
  <path d="M26 42 C26 36, 27 34, 28 32 L36 32 C37 34, 38 36, 38 42 Z" fill="#4d7593"/>
  <path d="M30 33 L29 42 L32 44 L35 42 L34 33 Z" fill="#6791b1"/>

  <!-- ==============================================
       CORONA GLACIAL DE CUERNOS CRISTALINOS MULTIFACÉTICOS
       ============================================== -->
  <!-- Cuerno Extremo Izquierdo (Templo) -->
  <polygon points="17,21 11,10 19,17" fill="url(#cuernoLuz)"/>
  <polygon points="17,21 19,17 21,21" fill="url(#cuernoSombra)"/>
  <line x1="19" y1="17" x2="11" y2="10" stroke="#ffffff" stroke-width="0.5" opacity="0.9"/>

  <!-- Cuerno Medio Izquierdo -->
  <polygon points="21,17 18,6 25,14" fill="url(#cuernoLuz)"/>
  <polygon points="21,17 25,14 26,18" fill="url(#cuernoSombra)"/>
  <line x1="25" y1="14" x2="18" y2="6" stroke="#ffffff" stroke-width="0.6" opacity="0.9"/>

  <!-- Cuerno Central Izquierdo (Espiga principal) -->
  <polygon points="26,15 25,3 30,12" fill="url(#cuernoLuz)"/>
  <polygon points="26,15 30,12 32,15" fill="url(#cuernoSombra)"/>
  <line x1="30" y1="12" x2="25" y2="3" stroke="#ffffff" stroke-width="0.6" opacity="0.95"/>

  <!-- Cuerno Central Derecho (Espiga principal) -->
  <polygon points="38,15 39,3 34,12" fill="url(#cuernoLuz)"/>
  <polygon points="38,15 34,12 32,15" fill="url(#cuernoSombra)"/>
  <line x1="34" y1="12" x2="39" y2="3" stroke="#ffffff" stroke-width="0.6" opacity="0.95"/>

  <!-- Cuerno Medio Derecho -->
  <polygon points="43,17 46,6 39,14" fill="url(#cuernoLuz)"/>
  <polygon points="43,17 39,14 38,18" fill="url(#cuernoSombra)"/>
  <line x1="39" y1="14" x2="46" y2="6" stroke="#ffffff" stroke-width="0.6" opacity="0.9"/>

  <!-- Cuerno Extremo Derecho (Templo) -->
  <polygon points="47,21 53,10 45,17" fill="url(#cuernoLuz)"/>
  <polygon points="47,21 45,17 43,21" fill="url(#cuernoSombra)"/>
  <line x1="45" y1="17" x2="53" y2="10" stroke="#ffffff" stroke-width="0.5" opacity="0.9"/>

  <!-- ==============================================
       ROSTRO ANCESTRAL ESCULPIDO EN FRÍO Y HIELO
       ============================================== -->
  <!-- Silueta craneal -->
  <path d="M21 28 C21 16, 24 14, 32 14 C40 14, 43 16, 43 28 C43 36, 40 41, 36 44 L32 47.5 L28 44 C24 41, 21 36, 21 28 Z" fill="url(#pielReyNoche)"/>

  <!-- Crestas óseas y arrugas de la frente (rasgo distintivo del Rey de la Noche) -->
  <path d="M24 17 C27 15, 30 15, 32 16 C34 15, 37 15, 40 17" stroke="#487291" stroke-width="0.8" fill="none" opacity="0.7"/>
  <path d="M25 19 C28 17.5, 30 17.5, 32 18.5 C34 17.5, 36 17.5, 39 19" stroke="#487291" stroke-width="0.8" fill="none" opacity="0.75"/>
  <path d="M26 21 C28 19.5, 30 19.5, 32 20.5 C34 19.5, 36 19.5, 38 21" stroke="#3d6380" stroke-width="0.7" fill="none" opacity="0.8"/>

  <!-- Hundimiento de las sienes -->
  <polygon points="21.5,23 25,25 24,30 21.5,28" fill="#2d516d" opacity="0.6"/>
  <polygon points="42.5,23 39,25 40,30 42.5,28" fill="#2d516d" opacity="0.6"/>

  <!-- Pómulos afilados de caminante blanco (planos de sombra tridimensionales) -->
  <polygon points="21.5,29 26,32 27,38 22,35" fill="#325977" opacity="0.75"/>
  <polygon points="42.5,29 38,32 37,38 42,35" fill="#325977" opacity="0.75"/>
  <!-- Resalte de luz en los pómulos -->
  <line x1="22" y1="29" x2="26" y2="32" stroke="#ffffff" stroke-width="0.6" opacity="0.7"/>
  <line x1="42" y1="29" x2="38" y2="32" stroke="#ffffff" stroke-width="0.6" opacity="0.7"/>

  <!-- Ceño fruncido y cuencas orbitales -->
  <polygon points="24,24 31,24 29,26 24,25" fill="#1b394f"/>
  <polygon points="40,24 33,24 35,26 40,25" fill="#1b394f"/>

  <!-- Nariz recta, afilada y gélida -->
  <polygon points="32,23 30.5,33 32,35 32,23" fill="#315570" opacity="0.85"/>
  <polygon points="32,23 33.5,33 32,35 32,23" fill="#e2f3fc" opacity="0.9"/>
  <polygon points="30.5,33 33.5,33 32,35.5" fill="#0b1b26"/>

  <!-- Boca impasible y cruel (labios finos sin emoción) -->
  <polygon points="27.5,38.5 32,37.5 36.5,38.5 32,39.5" fill="#2e5069"/>
  <line x1="27" y1="39" x2="37" y2="39" stroke="#0b1a26" stroke-width="1.1" stroke-linecap="round"/>
  <!-- Depresión bajo el labio y mentón esculpido -->
  <polygon points="29,40 35,40 33,42 31,42" fill="#223e53"/>
  <polygon points="30.5,43.5 33.5,43.5 32,46" fill="#cae5f5"/>

  <!-- ==============================================
       OJOS DEL REY DE LA NOCHE (FULGOR AZUL ZAFIRO PENETRANTE)
       ============================================== -->
  <!-- Cuencas oscuras profundas -->
  <ellipse cx="26.5" cy="27" rx="4" ry="2.8" fill="#030d17"/>
  <ellipse cx="37.5" cy="27" rx="4" ry="2.8" fill="#030d17"/>

  <!-- Ojo Izquierdo -->
  <g>
    <!-- Aura de fulgor zafiro animada -->
    <ellipse cx="26.5" cy="27" rx="3.5" ry="2.2" fill="url(#ojoReyZafiro)">
      <animate attributeName="opacity" values="0.85;1;0.85" dur="1.7s" repeatCount="indefinite"/>
    </ellipse>
    <!-- Núcleo ardiente blanco de hielo -->
    <circle cx="26.5" cy="27" r="1.1" fill="#ffffff"/>
    <circle cx="26.5" cy="27" r="0.5" fill="#bbf2f6"/>

    <!-- Haz de luz gélida proyectada hacia afuera (firma visual legendaria) -->
    <path d="M23 27 L15 26" stroke="#00f5ff" stroke-width="0.8" stroke-linecap="round" opacity="0.85">
      <animate attributeName="opacity" values="0.65;1;0.65" dur="1.7s" repeatCount="indefinite"/>
    </path>
    <path d="M24 28 L19 29.5" stroke="#70d6ff" stroke-width="0.5" stroke-linecap="round" opacity="0.6"/>
  </g>

  <!-- Ojo Derecho -->
  <g>
    <!-- Aura de fulgor zafiro animada -->
    <ellipse cx="37.5" cy="27" rx="3.5" ry="2.2" fill="url(#ojoReyZafiro)">
      <animate attributeName="opacity" values="0.85;1;0.85" dur="1.7s" repeatCount="indefinite"/>
    </ellipse>
    <!-- Núcleo ardiente blanco de hielo -->
    <circle cx="37.5" cy="27" r="1.1" fill="#ffffff"/>
    <circle cx="37.5" cy="27" r="0.5" fill="#bbf2f6"/>

    <!-- Haz de luz gélida proyectada hacia afuera -->
    <path d="M41 27 L49 26" stroke="#00f5ff" stroke-width="0.8" stroke-linecap="round" opacity="0.85">
      <animate attributeName="opacity" values="0.65;1;0.65" dur="1.7s" repeatCount="indefinite"/>
    </path>
    <path d="M40 28 L45 29.5" stroke="#70d6ff" stroke-width="0.5" stroke-linecap="round" opacity="0.6"/>
  </g>
</svg>
