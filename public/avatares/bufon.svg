<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="bgBufon" cx="50%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#3d1b40"/>
      <stop offset="60%" stop-color="#190a1c"/>
      <stop offset="100%" stop-color="#060207"/>
    </radialGradient>
    <linearGradient id="oroCascabel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff59d"/>
      <stop offset="50%" stop-color="#fbc02d"/>
      <stop offset="100%" stop-color="#c49000"/>
    </linearGradient>
  </defs>

  <!-- Fondo de trastienda del castillo -->
  <circle cx="32" cy="32" r="32" fill="url(#bgBufon)"/>

  <!-- Túnica y gorguera clásica de bufón con puntas y cascabeles -->
  <path d="M12 64 C13 50, 18 43, 25 42 L32 47 L39 42 C46 43, 51 50, 52 64 Z" fill="#1b2631"/>
  <!-- Mitad carmesí, mitad morado/verde medieval -->
  <path d="M12 64 C13 50, 18 43, 25 42 L32 47 L32 64 Z" fill="#78281f"/>
  <path d="M52 64 C51 50, 46 43, 39 42 L32 47 L32 64 Z" fill="#4a154b"/>

  <!-- Cuello de puntas festoneadas con cascabeles dorados -->
  <polygon points="18,48 24,53 22,46" fill="#f4d03f"/>
  <circle cx="24" cy="54" r="1.3" fill="url(#oroCascabel)"/>
  <polygon points="25,48 32,55 30,46" fill="#f4d03f"/>
  <circle cx="32" cy="56" r="1.5" fill="url(#oroCascabel)"/>
  <polygon points="39,48 33,54 35,46" fill="#f4d03f"/>
  <circle cx="40" cy="54" r="1.3" fill="url(#oroCascabel)"/>

  <!-- Rostro pálido teatral / máscara de arlequín de la corte -->
  <path d="M22 27 C22 18, 25 16, 32 16 C39 16, 42 18, 42 27 C42 35, 38 42, 32 44 C26 42, 22 35, 22 27 Z" fill="#f5eef8"/>

  <!-- Gorro de bufón de dos cuernos curvos (Bicorne medieval) con cascabeles -->
  <!-- Cuerno izquierdo (carmesí) -->
  <path d="M22 22 C18 16, 12 14, 8 18 C6 22, 10 26, 16 25 C19 25, 21 24, 23 23 Z" fill="#922b21"/>
  <circle cx="7" cy="19" r="2.2" fill="url(#oroCascabel)"/>

  <!-- Cuerno derecho (morado real) -->
  <path d="M42 22 C46 16, 52 14, 56 18 C58 22, 54 26, 48 25 C45 25, 43 24, 41 23 Z" fill="#5b2c6f"/>
  <circle cx="57" cy="19" r="2.2" fill="url(#oroCascabel)"/>

  <!-- Cinta frontal dorada del gorro -->
  <path d="M22 22 C26 19, 38 19, 42 22 L41 25 C37 22, 27 22, 23 25 Z" fill="url(#oroCascabel)"/>

  <!-- Maquillaje dramático de corte: diamantes sobre y bajo los ojos -->
  <!-- Ojo izquierdo -->
  <polygon points="27,22 28.5,24.5 27,27 25.5,24.5" fill="#c0392b"/>
  <polygon points="27,31 28.5,33.5 27,36 25.5,33.5" fill="#c0392b"/>
  <ellipse cx="27" cy="28.5" rx="2" ry="1.5" fill="#17202a"/>
  <circle cx="27" cy="28.5" r="0.9" fill="#f1c40f"/>
  <circle cx="27.3" cy="28.2" r="0.3" fill="#ffffff"/>

  <!-- Ojo derecho -->
  <polygon points="37,22 38.5,24.5 37,27 35.5,24.5" fill="#6c3483"/>
  <polygon points="37,31 38.5,33.5 37,36 35.5,33.5" fill="#6c3483"/>
  <ellipse cx="37" cy="28.5" rx="2" ry="1.5" fill="#17202a"/>
  <circle cx="37" cy="28.5" r="0.9" fill="#f1c40f"/>
  <circle cx="37.3" cy="28.2" r="0.3" fill="#ffffff"/>

  <!-- Sonrisa enigmática y pícara de bufón -->
  <path d="M26 38 C28 42, 36 42, 38 38 C35 39.5, 29 39.5, 26 38 Z" fill="#922b21"/>
</svg>
