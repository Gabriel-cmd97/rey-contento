<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="bgBufonMistico" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#3b1347"/>
      <stop offset="55%" stop-color="#1c0724"/>
      <stop offset="100%" stop-color="#07010a"/>
    </radialGradient>
    <linearGradient id="oroJester" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fffde7"/>
      <stop offset="30%" stop-color="#fdd835"/>
      <stop offset="70%" stop-color="#f57f17"/>
      <stop offset="100%" stop-color="#8c4e00"/>
    </linearGradient>
    <linearGradient id="terciopeloRojo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#b91c1c"/>
      <stop offset="50%" stop-color="#881337"/>
      <stop offset="100%" stop-color="#4c0519"/>
    </linearGradient>
    <linearGradient id="terciopeloMorado" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="50%" stop-color="#581c87"/>
      <stop offset="100%" stop-color="#2e1065"/>
    </linearGradient>
    <radialGradient id="porcelanaMascara" cx="45%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="65%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </radialGradient>
    <radialGradient id="ojoBufonPillo" cx="45%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#fffde7"/>
      <stop offset="40%" stop-color="#f59e0b"/>
      <stop offset="85%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#451a03"/>
    </radialGradient>
  </defs>

  <!-- Fondo nocturno del festival real -->
  <circle cx="32" cy="32" r="32" fill="url(#bgBufonMistico)"/>

  <!-- Brillo y niebla teatral de fondo -->
  <circle cx="32" cy="26" r="22" fill="#c084fc" opacity="0.12">
    <animate attributeName="opacity" values="0.08;0.2;0.08" dur="2.4s" repeatCount="indefinite"/>
  </circle>

  <!-- Destellos y confeti áureo de la mascarada -->
  <circle cx="12" cy="18" r="0.8" fill="#fde047" opacity="0.85">
    <animate attributeName="cy" values="18;10;18" dur="2.1s" repeatCount="indefinite"/>
  </circle>
  <circle cx="52" cy="20" r="0.9" fill="#f43f5e" opacity="0.8">
    <animate attributeName="cy" values="20;11;20" dur="2.6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="16" cy="46" r="0.7" fill="#a855f7" opacity="0.7"/>
  <circle cx="48" cy="48" r="0.7" fill="#fde047" opacity="0.75"/>

  <!-- Túnica y gorguera clásica de bufón con drapeado medieval -->
  <path d="M12 64 C13 50, 18 43, 25 42 L32 47 L39 42 C46 43, 51 50, 52 64 Z" fill="#090514"/>
  <path d="M12 64 C13 50, 18 43, 25 42 L32 47 L32 64 Z" fill="url(#terciopeloRojo)"/>
  <path d="M52 64 C51 50, 46 43, 39 42 L32 47 L32 64 Z" fill="url(#terciopeloMorado)"/>

  <!-- Cuello festoneado de puntas (Gorguera de la corte) -->
  <polygon points="17,46 23,54 22,44" fill="url(#oroJester)"/>
  <circle cx="23" cy="55" r="1.3" fill="url(#oroJester)"/>
  <polygon points="23,44 32,57 31,45" fill="#f1f5f9"/>
  <circle cx="32" cy="58" r="1.5" fill="url(#oroJester)"/>
  <polygon points="39,44 33,54 35,45" fill="url(#oroJester)"/>
  <circle cx="39" cy="55" r="1.3" fill="url(#oroJester)"/>
  <polygon points="41,45 47,53 45,46" fill="#f1f5f9"/>
  <circle cx="47" cy="54" r="1.3" fill="url(#oroJester)"/>

  <!-- Rostro fino de máscara veneciana de porcelana -->
  <path d="M22 26 C22 17, 25 15, 32 15 C39 15, 42 17, 42 26 C42 36, 38 43, 32 45 C26 43, 22 36, 22 26 Z" fill="url(#porcelanaMascara)" stroke="#334155" stroke-width="0.7"/>

  <!-- Gran sombrero de bufón de doble cuerno arqueado (Bicorne gótico) -->
  <!-- Cuerno izquierdo (terciopelo carmesí noble) -->
  <path d="M23 21 C17 14, 10 11, 6 15 C4 20, 8 26, 15 25 C18 24, 21 23, 23 22 Z" fill="url(#terciopeloRojo)" stroke="#450a0a" stroke-width="0.7"/>
  <!-- Relieve y sombra del cuerno -->
  <path d="M20 18 C15 14, 11 14, 8 16" stroke="#f87171" stroke-width="0.8" fill="none" opacity="0.8"/>
  <!-- Cascabel dorado campaniforme -->
  <circle cx="5.5" cy="16.5" r="2.4" fill="url(#oroJester)" stroke="#78350f" stroke-width="0.4"/>
  <circle cx="5" cy="15.5" r="0.6" fill="#ffffff"/>
  <line x1="4" y1="17" x2="7" y2="17" stroke="#78350f" stroke-width="0.4"/>

  <!-- Cuerno derecho (terciopelo morado real) -->
  <path d="M41 21 C47 14, 54 11, 58 15 C60 20, 56 26, 49 25 C46 24, 43 23, 41 22 Z" fill="url(#terciopeloMorado)" stroke="#1e1b4b" stroke-width="0.7"/>
  <!-- Relieve y sombra del cuerno -->
  <path d="M44 18 C49 14, 53 14, 56 16" stroke="#c084fc" stroke-width="0.8" fill="none" opacity="0.8"/>
  <!-- Cascabel dorado derecho -->
  <circle cx="58.5" cy="16.5" r="2.4" fill="url(#oroJester)" stroke="#78350f" stroke-width="0.4"/>
  <circle cx="58" cy="15.5" r="0.6" fill="#ffffff"/>
  <line x1="57" y1="17" x2="60" y2="17" stroke="#78350f" stroke-width="0.4"/>

  <!-- Diadema / Tiara frontal dorada con arabescos -->
  <path d="M21.5 21 C26 18, 38 18, 42.5 21 L42 24.5 C38 21.5, 26 21.5, 22 24.5 Z" fill="url(#oroJester)" stroke="#854d0e" stroke-width="0.5"/>
  <circle cx="32" cy="20.5" r="1.1" fill="#ef4444"/>
  <circle cx="27" cy="21.5" r="0.8" fill="#a855f7"/>
  <circle cx="37" cy="21.5" r="0.8" fill="#a855f7"/>

  <!-- Maquillaje dramático de arlequín veneciano -->
  <!-- Diamante superior e inferior en ojo izquierdo (carmesí) -->
  <polygon points="27,19 28.5,23 27,25 25.5,23" fill="#dc2626"/>
  <polygon points="27,32 28.5,34 27,38 25.5,34" fill="#dc2626"/>
  <!-- Diamante superior e inferior en ojo derecho (amatista) -->
  <polygon points="37,19 38.5,23 37,25 35.5,23" fill="#7c3aed"/>
  <polygon points="37,32 38.5,34 37,38 35.5,34" fill="#7c3aed"/>

  <!-- Ojos almendrados astutos y expresivos -->
  <path d="M24 28 Q27 25 30 28 Q27 30 24 28 Z" fill="#0f172a"/>
  <ellipse cx="27" cy="27.8" rx="2.2" ry="1.6" fill="url(#ojoBufonPillo)"/>
  <circle cx="27" cy="27.8" r="0.9" fill="#0f172a"/>
  <circle cx="27.5" cy="27.3" r="0.4" fill="#ffffff"/>

  <path d="M40 28 Q37 25 34 28 Q37 30 40 28 Z" fill="#0f172a"/>
  <ellipse cx="37" cy="27.8" rx="2.2" ry="1.6" fill="url(#ojoBufonPillo)"/>
  <circle cx="37" cy="27.8" r="0.9" fill="#0f172a"/>
  <circle cx="36.5" cy="27.3" r="0.4" fill="#ffffff"/>

  <!-- Cejas pícaras alzadas en burla cómplice -->
  <path d="M24 24 Q27 21 30 23" stroke="#1e293b" stroke-width="0.9" fill="none"/>
  <path d="M40 23 Q37 21 34 24" stroke="#1e293b" stroke-width="0.9" fill="none"/>

  <!-- Sonrisa enigmática de arlequín con labios carmesí brillante -->
  <path d="M25 38 C28 43, 36 43, 39 38 C36 40.5, 28 40.5, 25 38 Z" fill="#991b1b"/>
  <path d="M24.5 37.5 Q25 38.5 26 38" stroke="#7f1d1d" stroke-width="0.8" fill="none"/>
  <path d="M39.5 37.5 Q39 38.5 38 38" stroke="#7f1d1d" stroke-width="0.8" fill="none"/>

  <!-- Lágrima de brillo veneciano bajo el ojo izquierdo -->
  <circle cx="27" cy="35" r="0.6" fill="#fde047"/>
</svg>
