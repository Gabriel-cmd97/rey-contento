<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="bgMagoCosmico" cx="50%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    <linearGradient id="sombreroArcano" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b4252"/>
      <stop offset="35%" stop-color="#2e3440"/>
      <stop offset="75%" stop-color="#1e222a"/>
      <stop offset="100%" stop-color="#0b0e14"/>
    </linearGradient>
    <linearGradient id="barbaSabia" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#e2e8f0"/>
      <stop offset="80%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <radialGradient id="ojoZafiro" cx="45%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#67e8f9"/>
      <stop offset="70%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#082f49"/>
    </radialGradient>
    <linearGradient id="plataHebilla" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
  </defs>

  <!-- Fondo de firmamento estrellado -->
  <circle cx="32" cy="32" r="32" fill="url(#bgMagoCosmico)"/>

  <!-- Halo de sabiduría celestial -->
  <circle cx="32" cy="24" r="22" fill="#38bdf8" opacity="0.12">
    <animate attributeName="opacity" values="0.08;0.22;0.08" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- Polvo de estrellas y constelaciones -->
  <circle cx="14" cy="18" r="0.9" fill="#38bdf8" opacity="0.8">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="50" cy="16" r="0.8" fill="#fde047" opacity="0.85">
    <animate attributeName="opacity" values="1;0.4;1" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="52" cy="42" r="0.7" fill="#67e8f9" opacity="0.7"/>
  <circle cx="12" cy="44" r="0.6" fill="#fef08a" opacity="0.6"/>

  <!-- Túnica solemne de lana noche con bordados estelares -->
  <path d="M10 64 C11 50, 16 43, 24 42 L32 47 L40 42 C48 43, 53 50, 54 64 Z" fill="#0f172a"/>
  <path d="M25 43 L32 49 L39 43 Z" fill="#1e293b"/>
  <!-- Broche pectoral en orbe astral -->
  <circle cx="32" cy="45.5" r="2" fill="#38bdf8" stroke="#fde047" stroke-width="0.6"/>
  <circle cx="32" cy="45.5" r="0.7" fill="#ffffff"/>

  <!-- Barba blanca larga, majestuosa y ondulada de anciano sabio -->
  <path d="M21 36 C21 52, 26 62, 32 64 C38 62, 43 52, 43 36 C39 39, 36 39, 32 39 C28 39, 25 39, 21 36 Z" fill="url(#barbaSabia)"/>
  <!-- Mechones y trenzado fino con sombras suaves -->
  <path d="M25 41 C27 49, 29 57, 32 62 C35 57, 37 49, 39 41" stroke="#cbd5e1" stroke-width="0.9" fill="none"/>
  <path d="M22 43 Q26 53 30 60" stroke="#94a3b8" stroke-width="0.6" fill="none"/>
  <path d="M42 43 Q38 53 34 60" stroke="#94a3b8" stroke-width="0.6" fill="none"/>

  <!-- Bigote tupido y señorial que cae sobre la barba -->
  <path d="M24 35 C28 38.5, 31 38.5, 32 37.5 C33 38.5, 36 38.5, 40 35 C37 34, 34 34, 32 35 C30 34, 27 34, 24 35 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.4"/>

  <!-- Rostro venerado con arrugas de sabiduría -->
  <ellipse cx="32" cy="32" rx="8.5" ry="7.5" fill="#fde68a"/>
  <!-- Líneas de expresión suaves alrededor de los ojos -->
  <path d="M25 29 Q26 31 25 33" stroke="#b45309" stroke-width="0.5" fill="none" opacity="0.6"/>
  <path d="M39 29 Q38 31 39 33" stroke="#b45309" stroke-width="0.5" fill="none" opacity="0.6"/>

  <!-- Cejas pobladas y blancas de mago que sobresalen -->
  <path d="M24 28 C27 26, 30 27, 31 29" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" fill="none"/>
  <path d="M40 28 C37 26, 34 27, 33 29" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" fill="none"/>

  <!-- Ojos de zafiro ancestral brillante con fulgor místico -->
  <ellipse cx="28" cy="31" rx="2" ry="1.6" fill="#0f172a"/>
  <circle cx="28" cy="31" r="1.3" fill="url(#ojoZafiro)"/>
  <circle cx="28.4" cy="30.6" r="0.5" fill="#ffffff"/>

  <ellipse cx="36" cy="31" rx="2" ry="1.6" fill="#0f172a"/>
  <circle cx="36" cy="31" r="1.3" fill="url(#ojoZafiro)"/>
  <circle cx="36.4" cy="30.6" r="0.5" fill="#ffffff"/>

  <!-- Ala ancha y ondulada del sombrero de mago (Felt Wizard Hat) -->
  <ellipse cx="32" cy="23" rx="21" ry="6" fill="url(#sombreroArcano)" stroke="#090d14" stroke-width="0.8"/>
  <!-- Sombra bajo el ala sobre la frente -->
  <path d="M23 25 C26 27, 38 27, 41 25 C38 28, 26 28, 23 25 Z" fill="#020617" opacity="0.45"/>

  <!-- Copa cónica alta, curvada y gastada por los siglos -->
  <path d="M22 22 C23 13, 27 6, 35 2 C37 3, 39 6, 34 9 C40 12, 42 17, 42 22 Z" fill="url(#sombreroArcano)" stroke="#090d14" stroke-width="0.7"/>

  <!-- Banda de cuero noche con hebilla de plata grabada -->
  <path d="M22.5 21.5 C26 23.5, 38 23.5, 41.5 21.5 L41.8 23.5 C38 25.5, 26 25.5, 22.2 23.5 Z" fill="#1e1b4b"/>
  <rect x="29.5" y="21" width="5" height="3.2" rx="0.6" fill="none" stroke="url(#plataHebilla)" stroke-width="1"/>
  <circle cx="32" cy="22.6" r="0.5" fill="#fde047"/>

  <!-- Bordado estelar dorado en la copa del sombrero -->
  <!-- Pequeña luna creciente y estrella de plata -->
  <path d="M28 14 C27 12, 28 10, 30 9 C28.5 10, 28.5 13, 30 14 Z" fill="#fde047" opacity="0.85"/>
  <polygon points="34,13 34.5,14 35.5,14.2 34.7,15 35,16 34,15.3 33,16 33.3,15 32.5,14.2 33.5,14" fill="#67e8f9" opacity="0.9"/>
</svg>
