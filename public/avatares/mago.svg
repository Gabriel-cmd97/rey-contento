<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="bgMago" cx="50%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#233554"/>
      <stop offset="60%" stop-color="#0e1726"/>
      <stop offset="100%" stop-color="#050a12"/>
    </radialGradient>
    <linearGradient id="sombreroAzul" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#34495e"/>
      <stop offset="50%" stop-color="#212f3d"/>
      <stop offset="100%" stop-color="#17202a"/>
    </linearGradient>
    <linearGradient id="hebillaPlata" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fdfefe"/>
      <stop offset="50%" stop-color="#bdc3c7"/>
      <stop offset="100%" stop-color="#7f8c8d"/>
    </linearGradient>
    <linearGradient id="barbaMago" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#d5dbdb"/>
      <stop offset="100%" stop-color="#95a5a6"/>
    </linearGradient>
  </defs>

  <!-- Fondo nocturno sabio -->
  <circle cx="32" cy="32" r="32" fill="url(#bgMago)"/>

  <!-- Chispas de polvo de estrellas -->
  <circle cx="16" cy="18" r="0.7" fill="#64ffda" opacity="0.7"/>
  <circle cx="48" cy="20" r="0.9" fill="#f4d03f" opacity="0.8"/>
  <circle cx="50" cy="42" r="0.8" fill="#64ffda" opacity="0.6"/>

  <!-- Túnica medieval de lana noble azul oscuro -->
  <path d="M12 64 C13 50, 18 43, 25 42 L32 47 L39 42 C46 43, 51 50, 52 64 Z" fill="#1b2631"/>
  <path d="M28 44 L32 49 L36 44 Z" fill="#2c3e50"/>
  <!-- Broche estelar -->
  <circle cx="32" cy="45" r="1.5" fill="#f4d03f"/>

  <!-- Barba larga y tupida de gran mago -->
  <path d="M22 36 C22 52, 28 62, 32 63 C36 62, 42 52, 42 36 C38 38, 35 38, 32 38 C29 38, 26 38, 22 36 Z" fill="url(#barbaMago)"/>
  <path d="M25 40 C28 50, 30 56, 32 60 C34 56, 36 50, 39 40" stroke="#bdc3c7" stroke-width="0.8" fill="none"/>
  <!-- Bigote abundante -->
  <path d="M25 36 C28 39, 31 39, 32 38 C33 39, 36 39, 39 36 C36 35, 33 35, 32 36 C31 35, 28 35, 25 36 Z" fill="#ffffff"/>

  <!-- Rostro sabio y anciano -->
  <ellipse cx="32" cy="33" rx="8" ry="7" fill="#fad7a0"/>
  <path d="M27 30 C29 29, 31 30, 31 31" stroke="#935116" stroke-width="0.8" fill="none"/>
  <path d="M37 30 C35 29, 33 30, 33 31" stroke="#935116" stroke-width="0.8" fill="none"/>
  <!-- Ojos azules profundos llenos de sabiduría -->
  <circle cx="28.5" cy="32" r="1.2" fill="#2980b9"/>
  <circle cx="35.5" cy="32" r="1.2" fill="#2980b9"/>
  <circle cx="28.8" cy="31.8" r="0.4" fill="#ffffff"/>
  <circle cx="35.8" cy="31.8" r="0.4" fill="#ffffff"/>

  <!-- Ala ancha del sombrero medieval de viaje -->
  <ellipse cx="32" cy="24" rx="20" ry="5.5" fill="url(#sombreroAzul)" stroke="#17202a" stroke-width="0.8"/>

  <!-- Copa puntiaguda curva y desgastada del sombrero de mago -->
  <path d="M22 23 C24 14, 28 8, 34 3 C36 4, 38 6, 34 10 C39 12, 41 18, 42 23 Z" fill="url(#sombreroAzul)"/>

  <!-- Cinta del sombrero con hebilla de plata -->
  <path d="M22.5 22.5 C26 24, 38 24, 41.5 22.5 L41.8 24.5 C38 26, 26 26, 22.2 24.5 Z" fill="#154360"/>
  <rect x="30" y="22" width="4" height="3" rx="0.5" fill="none" stroke="url(#hebillaPlata)" stroke-width="0.9"/>
</svg>
