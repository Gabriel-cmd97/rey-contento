<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="bgReinaImperial" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#4a044e"/>
      <stop offset="55%" stop-color="#24072b"/>
      <stop offset="100%" stop-color="#0a020d"/>
    </radialGradient>
    <linearGradient id="oroCoronaReal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fffde7"/>
      <stop offset="25%" stop-color="#fef08a"/>
      <stop offset="55%" stop-color="#facc15"/>
      <stop offset="85%" stop-color="#ca8a04"/>
      <stop offset="100%" stop-color="#713f12"/>
    </linearGradient>
    <linearGradient id="cabelloOroOndas" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#f59e0b"/>
      <stop offset="80%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="pielReinaSeda" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#fff1f2"/>
      <stop offset="85%" stop-color="#fecdd3"/>
      <stop offset="100%" stop-color="#fda4af"/>
    </linearGradient>
    <radialGradient id="ojoEsmeraldaReina" cx="45%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#dcfce7"/>
      <stop offset="30%" stop-color="#22c55e"/>
      <stop offset="70%" stop-color="#15803d"/>
      <stop offset="100%" stop-color="#052e16"/>
    </radialGradient>
    <radialGradient id="rubiGema" cx="40%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#fecdd3"/>
      <stop offset="35%" stop-color="#e11d48"/>
      <stop offset="80%" stop-color="#881337"/>
      <stop offset="100%" stop-color="#4c0519"/>
    </radialGradient>
  </defs>

  <!-- Fondo de terciopelo de la sala del trono -->
  <circle cx="32" cy="32" r="32" fill="url(#bgReinaImperial)"/>

  <!-- Resplandor áureo solemne -->
  <circle cx="32" cy="26" r="23" fill="#fde047" opacity="0.12">
    <animate attributeName="opacity" values="0.08;0.2;0.08" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- Destellos de joyas y polvo áureo -->
  <circle cx="12" cy="18" r="0.8" fill="#fde047" opacity="0.85">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="2.1s" repeatCount="indefinite"/>
  </circle>
  <circle cx="52" cy="22" r="0.8" fill="#f43f5e" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0.3;0.8" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="14" cy="46" r="0.7" fill="#4ade80" opacity="0.7"/>
  <circle cx="50" cy="48" r="0.7" fill="#fde047" opacity="0.7"/>

  <!-- Manto real púrpura con forro de armiño imperial -->
  <path d="M10 64 C11 50, 17 42, 23 41 L32 46 L41 41 C47 42, 53 50, 54 64 Z" fill="#3b0744"/>
  <path d="M25 42 L32 48 L39 42 L32 37 Z" fill="url(#oroCoronaReal)"/>

  <!-- Collar de filigrana dorada con gran zafiro imperial -->
  <circle cx="32" cy="44" r="2.2" fill="url(#oroCoronaReal)"/>
  <circle cx="32" cy="44" r="1.4" fill="#0284c7" stroke="#38bdf8" stroke-width="0.3"/>
  <circle cx="32.4" cy="43.5" r="0.4" fill="#ffffff"/>

  <!-- Cuello de armiño blanco con motas negras heráldicas -->
  <path d="M12 64 C14 52, 19 45, 25 43 L22 64 Z" fill="#f8fafc"/>
  <circle cx="17" cy="54" r="0.7" fill="#090d16"/><circle cx="19" cy="60" r="0.7" fill="#090d16"/>
  <path d="M52 64 C50 52, 45 45, 39 43 L42 64 Z" fill="#f8fafc"/>
  <circle cx="47" cy="54" r="0.7" fill="#090d16"/><circle cx="45" cy="60" r="0.7" fill="#090d16"/>

  <!-- Cabello dorado ondulado en cascada señorial -->
  <path d="M18 28 C18 16, 23 12, 32 12 C41 12, 46 16, 46 28 C46 39, 44 47, 42 52 L39 44 C40 36, 41 27, 41 24 C41 17, 37 15, 32 15 C27 15, 23 17, 23 24 C23 27, 24 36, 25 44 L22 52 C20 47, 18 39, 18 28 Z" fill="url(#cabelloOroOndas)"/>
  <!-- Reflejos suaves en el cabello -->
  <path d="M20 28 C20 22, 22 17, 26 15" stroke="#fef08a" stroke-width="0.9" fill="none" opacity="0.8"/>
  <path d="M44 28 C44 22, 42 17, 38 15" stroke="#fef08a" stroke-width="0.9" fill="none" opacity="0.8"/>
  <path d="M21 34 Q22 43 23 48" stroke="#fef08a" stroke-width="0.7" fill="none" opacity="0.7"/>
  <path d="M43 34 Q42 43 41 48" stroke="#fef08a" stroke-width="0.7" fill="none" opacity="0.7"/>

  <!-- Rostro sereno de soberana con tez de alabastro -->
  <path d="M23 25 C23 18, 26 17, 32 17 C38 17, 41 18, 41 25 C41 34, 38 40, 32 43 C26 40, 23 34, 23 25 Z" fill="url(#pielReinaSeda)"/>

  <!-- Corona Imperial de la Reina (Alta orfebrería gótica) -->
  <path d="M18 19 L21 9 L25 16 L32 5 L39 16 L43 9 L46 19 L45 22 L19 22 Z" fill="url(#oroCoronaReal)" stroke="#713f12" stroke-width="0.7"/>

  <!-- Perlas en los extremos de la corona -->
  <circle cx="21" cy="9" r="1.3" fill="#ffffff" stroke="#e2e8f0" stroke-width="0.3"/>
  <circle cx="32" cy="5" r="1.6" fill="#ffffff" stroke="#e2e8f0" stroke-width="0.3"/>
  <circle cx="43" cy="9" r="1.3" fill="#ffffff" stroke="#e2e8f0" stroke-width="0.3"/>

  <!-- Gran Esmeralda engarzada en el pico central -->
  <polygon points="32,9 34.5,13 32,17 29.5,13" fill="#15803d" stroke="#fef08a" stroke-width="0.5"/>
  <polygon points="32,10 33.5,13 32,15 30.5,13" fill="#22c55e"/>
  <circle cx="32" cy="12.5" r="0.5" fill="#ffffff"/>

  <!-- Rubíes en los arcos laterales de la corona -->
  <circle cx="25" cy="18" r="1.1" fill="url(#rubiGema)" stroke="#fef08a" stroke-width="0.3"/>
  <circle cx="39" cy="18" r="1.1" fill="url(#rubiGema)" stroke="#fef08a" stroke-width="0.3"/>
  <circle cx="32" cy="20.5" r="0.9" fill="url(#rubiGema)"/>

  <!-- Cejas nobles y refinadas -->
  <path d="M25 25 C27 23.5, 30 24.5, 30 26" stroke="#92400e" stroke-width="0.8" fill="none"/>
  <path d="M39 25 C37 23.5, 34 24.5, 34 26" stroke="#92400e" stroke-width="0.8" fill="none"/>

  <!-- Ojos de esmeralda noble y luminosa -->
  <ellipse cx="28" cy="28" rx="2" ry="1.5" fill="#0f172a"/>
  <ellipse cx="28" cy="28" rx="1.6" ry="1.3" fill="url(#ojoEsmeraldaReina)"/>
  <circle cx="28" cy="28" r="0.6" fill="#052e16"/>
  <circle cx="28.4" cy="27.6" r="0.4" fill="#ffffff"/>

  <ellipse cx="36" cy="28" rx="2" ry="1.5" fill="#0f172a"/>
  <ellipse cx="36" cy="28" rx="1.6" ry="1.3" fill="url(#ojoEsmeraldaReina)"/>
  <circle cx="36" cy="28" r="0.6" fill="#052e16"/>
  <circle cx="36.4" cy="27.6" r="0.4" fill="#ffffff"/>

  <!-- Rubor suave y labios bermellón -->
  <circle cx="25" cy="33" r="1.5" fill="#fb7185" opacity="0.35"/>
  <circle cx="39" cy="33" r="1.5" fill="#fb7185" opacity="0.35"/>
  <path d="M29.5 36.5 C31 35.5, 33 35.5, 34.5 36.5 C33.5 38.5, 30.5 38.5, 29.5 36.5 Z" fill="#be123c"/>
</svg>
