<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <!-- Fondo de abismo de cenizas y amanecer solar -->
    <radialGradient id="bgFenixReal" cx="50%" cy="42%" r="62%">
      <stop offset="0%" stop-color="#fff3b0"/>
      <stop offset="25%" stop-color="#f39c12"/>
      <stop offset="65%" stop-color="#78281f"/>
      <stop offset="100%" stop-color="#240502"/>
    </radialGradient>

    <!-- Gradiente de alas y plumas de fuego sagrado -->
    <linearGradient id="fuegoAlas" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#78281f"/>
      <stop offset="30%" stop-color="#c0392b"/>
      <stop offset="65%" stop-color="#f39c12"/>
      <stop offset="90%" stop-color="#f1c40f"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>

    <!-- Gradiente del torso y pecho ardiente -->
    <linearGradient id="pechoFenix" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff9c4"/>
      <stop offset="35%" stop-color="#f39c12"/>
      <stop offset="80%" stop-color="#c0392b"/>
      <stop offset="100%" stop-color="#501814"/>
    </linearGradient>

    <!-- Gradiente para el pico de oro forjado -->
    <linearGradient id="picoFenix" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#f1c40f"/>
      <stop offset="100%" stop-color="#b7950b"/>
    </linearGradient>

    <!-- Ojo solar abrasador -->
    <radialGradient id="ojoSolarFenix" cx="45%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#ffeb3b"/>
      <stop offset="85%" stop-color="#e67e22"/>
      <stop offset="100%" stop-color="#900c3f"/>
    </radialGradient>
  </defs>

  <!-- Fondo circular del avatar -->
  <circle cx="32" cy="32" r="32" fill="url(#bgFenixReal)"/>

  <!-- Halo de resplandor pulsante del Fénix -->
  <circle cx="32" cy="30" r="26" fill="#f39c12" opacity="0.25">
    <animate attributeName="r" values="24;28;24" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.18;0.35;0.18" dur="2s" repeatCount="indefinite"/>
  </circle>

  <!-- Chispas y brasas que ascienden hacia los cielos -->
  <circle cx="10" cy="46" r="0.9" fill="#fff9c4">
    <animate attributeName="cy" values="46;14" dur="2.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="54" cy="48" r="1.1" fill="#fff176">
    <animate attributeName="cy" values="48;12" dur="2.8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0" dur="2.8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="24" cy="52" r="0.8" fill="#f39c12">
    <animate attributeName="cy" values="52;22" dur="2.1s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0" dur="2.1s" repeatCount="indefinite"/>
  </circle>
  <circle cx="40" cy="54" r="0.7" fill="#f39c12">
    <animate attributeName="cy" values="54;26" dur="2.3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0" dur="2.3s" repeatCount="indefinite"/>
  </circle>

  <!-- Grupo central del Fénix con animación de vuelo / aleteo majestuoso -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0,1; 0,-1.5; 0,1" dur="2.2s" repeatCount="indefinite" additive="sum"/>

    <!-- Cola sagrada de fuego: 3 largas cintas que caen ondulando -->
    <path d="M32 44 Q28 54 22 64 Q26 56 31 46 Z" fill="url(#fuegoAlas)" opacity="0.85"/>
    <path d="M32 44 Q36 54 42 64 Q38 56 33 46 Z" fill="url(#fuegoAlas)" opacity="0.85"/>
    <path d="M32 45 Q30 55 32 64 Q34 55 32 45 Z" fill="#f1c40f"/>

    <!-- ALA IZQUIERDA DESPLEGADA (Grandes plumas de fuego ascendente) -->
    <!-- Capa de plumas exteriores / primarias -->
    <path d="M32 38 C22 36, 11 26, 4 10 C8 17, 14 22, 19 22 C13 16, 9 9, 8 3 C13 11, 19 16, 25 18 C20 12, 18 6, 17 1 C22 8, 27 15, 32 20 Z" fill="url(#fuegoAlas)"/>
    <!-- Plumas secundarias interiores del ala izquierda -->
    <path d="M30 38 C22 34, 15 28, 12 20 C16 24, 22 26, 27 24 C23 20, 20 15, 20 10 C24 16, 28 20, 31 22 Z" fill="#fff176" opacity="0.9"/>

    <!-- ALA DERECHA DESPLEGADA (Simétrica, fuego ardiente) -->
    <!-- Capa de plumas exteriores / primarias -->
    <path d="M32 38 C42 36, 53 26, 60 10 C56 17, 50 22, 45 22 C51 16, 55 9, 56 3 C51 11, 45 16, 39 18 C44 12, 46 6, 47 1 C42 8, 37 15, 32 20 Z" fill="url(#fuegoAlas)"/>
    <!-- Plumas secundarias interiores del ala derecha -->
    <path d="M34 38 C42 34, 49 28, 52 20 C48 24, 42 26, 37 24 C41 20, 44 15, 44 10 C40 16, 36 20, 33 22 Z" fill="#fff176" opacity="0.9"/>

    <!-- Torso elegante del Fénix -->
    <path d="M32 21 C28 21, 26 26, 26 33 C26 40, 29 45, 32 46 C35 45, 38 40, 38 33 C38 26, 36 21, 32 21 Z" fill="url(#pechoFenix)"/>
    <!-- Brillo dorado en el centro del pecho -->
    <ellipse cx="32" cy="32" rx="3.5" ry="7" fill="#fff9c4" opacity="0.6"/>

    <!-- Cuello y cabeza orgullosa del Fénix mirando al frente / cielo -->
    <path d="M30 22 C30 16, 31 13, 32 11 C33 13, 34 16, 34 22 Z" fill="#ffeaa7"/>
    <ellipse cx="32" cy="14" rx="4.5" ry="5.5" fill="#f39c12"/>

    <!-- Corona / Cresta Real de Fuego con 3 plumas erguidas -->
    <path d="M32 11 Q32 3 32 0 Q34 4 33 11 Z" fill="#ffffff"/>
    <path d="M31 11 Q28 5 24 2 Q27 7 30 11 Z" fill="#fff176"/>
    <path d="M33 11 Q36 5 40 2 Q37 7 34 11 Z" fill="#fff176"/>

    <!-- Pico regio curvado de halcón solar -->
    <polygon points="32,13 30,16 34,16" fill="url(#picoFenix)"/>
    <path d="M30 16 Q32 19 32 21 Q32 19 34 16 Z" fill="url(#picoFenix)"/>

    <!-- Ojos solares gemelos abrasadores -->
    <circle cx="29.5" cy="14" r="1.3" fill="url(#ojoSolarFenix)"/>
    <circle cx="29.2" cy="13.7" r="0.4" fill="#ffffff"/>
    <circle cx="34.5" cy="14" r="1.3" fill="url(#ojoSolarFenix)"/>
    <circle cx="34.2" cy="13.7" r="0.4" fill="#ffffff"/>
  </g>
</svg>
