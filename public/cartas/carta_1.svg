<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 240" width="100%" height="100%">
  <defs>
    <linearGradient id="bgRata" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1b291d"/>
      <stop offset="50%" stop-color="#141c15"/>
      <stop offset="100%" stop-color="#0a100a"/>
    </linearGradient>
    <linearGradient id="bordeBronce" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8d6e4a"/>
      <stop offset="35%" stop-color="#d4ac0d"/>
      <stop offset="70%" stop-color="#7d6608"/>
      <stop offset="100%" stop-color="#4a3b1a"/>
    </linearGradient>
    <radialGradient id="arcoRata" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#233a25"/>
      <stop offset="60%" stop-color="#122013"/>
      <stop offset="100%" stop-color="#050a06"/>
    </radialGradient>
    <linearGradient id="pelajeRata" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4a3e35"/>
      <stop offset="45%" stop-color="#30261f"/>
      <stop offset="100%" stop-color="#191410"/>
    </linearGradient>
    <radialGradient id="ojoRata" cx="35%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#ff7675"/>
      <stop offset="45%" stop-color="#d63031"/>
      <stop offset="100%" stop-color="#550000"/>
    </radialGradient>
    <radialGradient id="rubiRobado" cx="35%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#55efc4"/>
      <stop offset="50%" stop-color="#00b894"/>
      <stop offset="100%" stop-color="#004d40"/>
    </radialGradient>
    <linearGradient id="cintaRata" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2e4030"/>
      <stop offset="50%" stop-color="#1b291d"/>
      <stop offset="100%" stop-color="#0c160e"/>
    </linearGradient>
    <filter id="sombraRata" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.85"/>
    </filter>
  </defs>

  <!-- Tarjeta base -->
  <rect width="160" height="240" rx="12" fill="url(#bgRata)"/>
  
  <!-- Marcos metálicos -->
  <rect x="4" y="4" width="152" height="232" rx="9" fill="none" stroke="url(#bordeBronce)" stroke-width="2.5"/>
  <rect x="8" y="8" width="144" height="224" rx="7" fill="none" stroke="#2ecc71" stroke-width="0.8" stroke-opacity="0.3" stroke-dasharray="4,2"/>

  <!-- Esquinas ornamentadas -->
  <path d="M12 18 L18 12 M12 12 L19 19 M12 22 L22 12" stroke="#d4ac0d" stroke-width="1" opacity="0.6"/>
  <path d="M148 18 L142 12 M148 12 L141 19 M148 22 L138 12" stroke="#d4ac0d" stroke-width="1" opacity="0.6"/>
  <path d="M12 222 L18 228 M12 228 L19 221 M12 218 L22 228" stroke="#d4ac0d" stroke-width="1" opacity="0.6"/>
  <path d="M148 222 L142 228 M148 228 L141 221 M148 218 L138 228" stroke="#d4ac0d" stroke-width="1" opacity="0.6"/>

  <!-- Número Superior Izquierdo -->
  <g transform="translate(14, 14)">
    <circle cx="10" cy="10" r="10" fill="#141c15" stroke="url(#bordeBronce)" stroke-width="1.5" filter="url(#sombraRata)"/>
    <text x="10" y="14" text-anchor="middle" font-family="'Cinzel', 'MedievalSharp', serif" font-weight="900" font-size="13" fill="#f1c40f" filter="drop-shadow(0 1px 2px #000)">1</text>
  </g>

  <!-- Número Inferior Derecho -->
  <g transform="translate(126, 206)">
    <circle cx="10" cy="10" r="10" fill="#141c15" stroke="url(#bordeBronce)" stroke-width="1.5" filter="url(#sombraRata)"/>
    <text x="10" y="14" text-anchor="middle" font-family="'Cinzel', 'MedievalSharp', serif" font-weight="900" font-size="13" fill="#f1c40f" filter="drop-shadow(0 1px 2px #000)">1</text>
  </g>

  <!-- Ventana Gótica Central (Retrato de la Rata) -->
  <path d="M22 68 Q22 28 80 28 Q138 28 138 68 L138 178 L22 178 Z" fill="url(#arcoRata)" filter="url(#sombraRata)"/>

  <!-- Ladrillos de cloaca húmeda con musgo -->
  <path d="M30 65 H130 M30 90 H130 M30 115 H130 M30 140 H130 M30 165 H130" stroke="#1b3020" stroke-width="1" stroke-dasharray="16,8"/>
  <circle cx="45" cy="105" r="2" fill="#2ecc71" opacity="0.4"/>
  <circle cx="115" cy="130" r="1.5" fill="#2ecc71" opacity="0.5"/>

  <!-- Cola sinuosa de rata asomando atrás -->
  <path d="M105 178 Q125 155 118 130 Q112 110 120 95" fill="none" stroke="#7f6655" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M105 178 Q125 155 118 130 Q112 110 120 95" fill="none" stroke="#b08d79" stroke-width="1.2" stroke-linecap="round" opacity="0.6"/>

  <!-- Cuerpo de la Rata -->
  <ellipse cx="80" cy="150" rx="34" ry="28" fill="url(#pelajeRata)"/>
  
  <!-- Orejas grandes y rosadas en interior -->
  <ellipse cx="58" cy="78" rx="14" ry="17" fill="#30261f" transform="rotate(-15 58 78)"/>
  <ellipse cx="58" cy="78" rx="9" ry="12" fill="#c0857b" transform="rotate(-15 58 78)"/>
  
  <ellipse cx="102" cy="78" rx="14" ry="17" fill="#30261f" transform="rotate(15 102 78)"/>
  <ellipse cx="102" cy="78" rx="9" ry="12" fill="#c0857b" transform="rotate(15 102 78)"/>

  <!-- Cabeza de la Rata -->
  <path d="M62 90 C60 70 100 70 98 90 C96 112 88 126 80 128 C72 126 64 112 62 90 Z" fill="url(#pelajeRata)"/>
  <path d="M68 95 Q80 122 92 95 Z" fill="#241c17"/>

  <!-- Hocico y nariz rosada -->
  <path d="M74 122 Q80 120 86 122 L80 128 Z" fill="#e17055"/>
  <circle cx="80" cy="123" r="1.2" fill="#fff" opacity="0.7"/>

  <!-- Dientes afilados característicos -->
  <rect x="78" y="127" width="2" height="4" rx="0.5" fill="#fff"/>
  <rect x="80.5" y="127" width="2" height="4" rx="0.5" fill="#fff"/>

  <!-- Ojos brillantes de rubí -->
  <ellipse cx="68" cy="92" rx="4.5" ry="5.5" fill="url(#ojoRata)"/>
  <ellipse cx="92" cy="92" rx="4.5" ry="5.5" fill="url(#ojoRata)"/>
  <circle cx="67" cy="90" r="1.5" fill="#fff"/>
  <circle cx="91" cy="90" r="1.5" fill="#fff"/>

  <!-- Bigotes finos y alertas -->
  <path d="M70 118 L40 110 M70 121 L38 120 M70 124 L42 128" stroke="#d5c8ba" stroke-width="0.9" opacity="0.85"/>
  <path d="M90 118 L120 110 M90 121 L122 120 M90 124 L118 128" stroke="#d5c8ba" stroke-width="0.9" opacity="0.85"/>

  <!-- Pecho y patas sosteniendo una joya robada -->
  <!-- Pecho más claro -->
  <path d="M72 135 Q80 155 88 135" fill="none" stroke="#5d4c40" stroke-width="6" stroke-linecap="round"/>

  <!-- Manos sosteniendo la gema esmeralda brillante -->
  <polygon points="80,140 89,148 80,160 71,148" fill="url(#rubiRobado)" stroke="#55efc4" stroke-width="1"/>
  <circle cx="78" cy="146" r="1.5" fill="#fff" opacity="0.9"/>
  <!-- Garras pequeñas sobre la gema -->
  <circle cx="72" cy="148" r="2.5" fill="#c0857b"/>
  <circle cx="88" cy="148" r="2.5" fill="#c0857b"/>

  <!-- Marco de la Ventana Gótica -->
  <path d="M22 68 Q22 28 80 28 Q138 28 138 68 L138 178 L22 178 Z" fill="none" stroke="url(#bordeBronce)" stroke-width="2.5"/>
  <path d="M26 70 Q26 33 80 33 Q134 33 134 70 L134 174 L26 174 Z" fill="none" stroke="#2ecc71" stroke-width="1" opacity="0.4"/>

  <!-- Pergamino / Cinta del Nombre Inferior -->
  <g transform="translate(16, 185)" filter="url(#sombraRata)">
    <path d="M0 8 L12 0 L12 24 L0 16 Z" fill="#141c15"/>
    <path d="M128 8 L116 0 L116 24 L128 16 Z" fill="#141c15"/>
    <rect x="8" y="0" width="112" height="24" rx="3" fill="url(#cintaRata)" stroke="url(#bordeBronce)" stroke-width="1.5"/>
    <text x="64" y="16" text-anchor="middle" font-family="'Cinzel', 'MedievalSharp', serif" font-weight="900" font-size="9.5" fill="#f1c40f" letter-spacing="1" filter="drop-shadow(0 1px 2px #000)">1 · LA RATA</text>
  </g>
</svg>
