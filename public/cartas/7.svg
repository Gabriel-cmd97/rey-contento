<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 240" width="100%" height="100%">
  <defs>
    <linearGradient id="bgMago" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#151b40"/>
      <stop offset="50%" stop-color="#0a0f26"/>
      <stop offset="100%" stop-color="#040612"/>
    </linearGradient>
    <linearGradient id="bordeCosmico" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a569bd"/>
      <stop offset="35%" stop-color="#5dade2"/>
      <stop offset="70%" stop-color="#6c3483"/>
      <stop offset="100%" stop-color="#1f618d"/>
    </linearGradient>
    <radialGradient id="arcoMago" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#1c2859"/>
      <stop offset="55%" stop-color="#0d1430"/>
      <stop offset="100%" stop-color="#03050f"/>
    </radialGradient>
    <linearGradient id="tunicaMago" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#283593"/>
      <stop offset="50%" stop-color="#1a237e"/>
      <stop offset="100%" stop-color="#0d1240"/>
    </linearGradient>
    <radialGradient id="orbeMagico" cx="40%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#00ffff"/>
      <stop offset="70%" stop-color="#7d3c98"/>
      <stop offset="100%" stop-color="#1b4f72"/>
    </radialGradient>
    <radialGradient id="auraOrbe" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00ffff" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#a569bd" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cintaMago" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#23184d"/>
      <stop offset="50%" stop-color="#130d2d"/>
      <stop offset="100%" stop-color="#070414"/>
    </linearGradient>
    <filter id="sombraMago" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.85"/>
    </filter>
  </defs>

  <!-- Tarjeta base -->
  <rect width="160" height="240" rx="12" fill="url(#bgMago)"/>
  
  <!-- Marcos metálicos -->
  <rect x="4" y="4" width="152" height="232" rx="9" fill="none" stroke="url(#bordeCosmico)" stroke-width="2.5"/>
  <rect x="8" y="8" width="144" height="224" rx="7" fill="none" stroke="#5dade2" stroke-width="0.8" stroke-opacity="0.4" stroke-dasharray="4,2"/>

  <!-- Esquinas -->
  <path d="M12 18 L18 12 M12 12 L19 19 M12 22 L22 12" stroke="#5dade2" stroke-width="1" opacity="0.6"/>
  <path d="M148 18 L142 12 M148 12 L141 19 M148 22 L138 12" stroke="#5dade2" stroke-width="1" opacity="0.6"/>
  <path d="M12 222 L18 228 M12 228 L19 221 M12 218 L22 228" stroke="#5dade2" stroke-width="1" opacity="0.6"/>
  <path d="M148 222 L142 228 M148 228 L141 221 M148 218 L138 228" stroke="#5dade2" stroke-width="1" opacity="0.6"/>

  <!-- Número Superior Izquierdo -->
  <g transform="translate(14, 14)">
    <circle cx="10" cy="10" r="10" fill="#0a0f26" stroke="url(#bordeCosmico)" stroke-width="1.5" filter="url(#sombraMago)"/>
    <text x="10" y="14" text-anchor="middle" font-family="'Cinzel', 'MedievalSharp', serif" font-weight="900" font-size="13" fill="#d2b4de" filter="drop-shadow(0 1px 2px #000)">7</text>
  </g>

  <!-- Número Inferior Derecho -->
  <g transform="translate(126, 206)">
    <circle cx="10" cy="10" r="10" fill="#0a0f26" stroke="url(#bordeCosmico)" stroke-width="1.5" filter="url(#sombraMago)"/>
    <text x="10" y="14" text-anchor="middle" font-family="'Cinzel', 'MedievalSharp', serif" font-weight="900" font-size="13" fill="#d2b4de" filter="drop-shadow(0 1px 2px #000)">7</text>
  </g>

  <!-- Ventana Gótica Central (Retrato del Mago) -->
  <path d="M22 68 Q22 28 80 28 Q138 28 138 68 L138 178 L22 178 Z" fill="url(#arcoMago)" filter="url(#sombraMago)"/>

  <!-- Constelaciones y runas astrales de fondo -->
  <g opacity="0.4">
    <circle cx="40" cy="50" r="1.5" fill="#00ffff"/>
    <circle cx="55" cy="40" r="1.2" fill="#fff"/>
    <circle cx="65" cy="55" r="1.5" fill="#f1c40f"/>
    <line x1="40" y1="50" x2="55" y2="40" stroke="#00ffff" stroke-width="0.6"/>
    <line x1="55" y1="40" x2="65" y2="55" stroke="#f1c40f" stroke-width="0.6"/>

    <circle cx="120" cy="50" r="1.5" fill="#00ffff"/>
    <circle cx="105" cy="42" r="1.2" fill="#fff"/>
    <circle cx="125" cy="65" r="1.5" fill="#a569bd"/>
    <line x1="120" y1="50" x2="105" y2="42" stroke="#00ffff" stroke-width="0.6"/>
    <line x1="120" y1="50" x2="125" y2="65" stroke="#a569bd" stroke-width="0.6"/>
  </g>

  <!-- Túnica astral azul medianoche -->
  <path d="M36 178 Q42 125 60 118 Q80 115 100 118 Q118 125 124 178 Z" fill="url(#tunicaMago)"/>
  <!-- Bordados rúnicos dorados en la estola -->
  <path d="M66 118 L70 178 M94 118 L90 178" stroke="#f1c40f" stroke-width="1.2"/>
  <circle cx="68" cy="135" r="1.5" fill="#f1c40f"/>
  <circle cx="92" cy="135" r="1.5" fill="#f1c40f"/>
  <circle cx="69" cy="155" r="1.5" fill="#00ffff"/>
  <circle cx="91" cy="155" r="1.5" fill="#00ffff"/>

  <!-- Rostro anciano y venerable -->
  <ellipse cx="80" cy="100" rx="13" ry="15" fill="#d7ccc8"/>
  <path d="M69 84 C69 72 91 72 91 84 C91 94 86 102 80 102 C74 102 69 94 69 84 Z" fill="#eed9c4"/>

  <!-- Ojos resplandecientes con poder arcano azul -->
  <ellipse cx="74" cy="85" rx="3.5" ry="3.5" fill="#00ffff" opacity="0.8"/>
  <ellipse cx="86" cy="85" rx="3.5" ry="3.5" fill="#00ffff" opacity="0.8"/>
  <circle cx="74" cy="85" r="1.8" fill="#ffffff"/>
  <circle cx="86" cy="85" r="1.8" fill="#ffffff"/>
  <!-- Cejas pobladas y ceñudas de sabio -->
  <path d="M68 80 Q74 76 79 82 M81 82 Q86 76 92 80" stroke="#f5f5f5" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- Nariz aguileña -->
  <path d="M80 82 L78 90 L82 90" stroke="#a1887f" stroke-width="1" fill="none"/>

  <!-- Larga barba plateada que fluye -->
  <path d="M67 92 C65 125 72 155 80 162 C88 155 95 125 93 92 C88 98 72 98 67 92 Z" fill="#eceff1"/>
  <path d="M72 98 Q80 150 82 160" stroke="#cfd8dc" stroke-width="1.2" fill="none"/>
  <path d="M88 98 Q80 150 78 160" stroke="#cfd8dc" stroke-width="1.2" fill="none"/>
  <!-- Bigote arqueado -->
  <path d="M72 92 Q79 96 80 94 Q81 96 88 92" stroke="#eceff1" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- Sombrero de Archimago puntiagudo -->
  <!-- Ala doblada del sombrero -->
  <ellipse cx="80" cy="74" rx="28" ry="10" fill="#1a237e" stroke="#f1c40f" stroke-width="1"/>
  <!-- Cono del sombrero torcido hacia la derecha -->
  <path d="M56 72 Q65 40 85 24 Q95 38 104 72 Z" fill="url(#tunicaMago)"/>
  <path d="M85 24 Q95 20 98 26 Q92 30 85 24 Z" fill="#1a237e"/>
  <!-- Luna creciente plateada en el sombrero -->
  <path d="M76 46 C79 43 85 43 88 47 C84 48 83 54 86 56 C80 57 75 52 76 46 Z" fill="#f1c40f"/>
  <!-- Estrellitas bordadas -->
  <polygon points="70,55 71,58 74,59 71,60 70,63 69,60 66,59 69,58" fill="#f9e79f"/>
  <polygon points="94,52 95,54 97,55 95,56 94,58 93,56 91,55 93,54" fill="#00ffff"/>

  <!-- Orbe mágico flotante resplandeciente -->
  <g transform="translate(102, 120)">
    <!-- Resplandor exterior difuso -->
    <circle cx="16" cy="16" r="22" fill="url(#auraOrbe)"/>
    <!-- Anillo astral giratorio -->
    <ellipse cx="16" cy="16" rx="20" ry="6" fill="none" stroke="#00ffff" stroke-width="1.2" transform="rotate(-30 16 16)"/>
    <ellipse cx="16" cy="16" rx="20" ry="6" fill="none" stroke="#e056fd" stroke-width="0.8" transform="rotate(45 16 16)"/>
    <!-- Esfera mágica principal -->
    <circle cx="16" cy="16" r="11" fill="url(#orbeMagico)" filter="url(#sombraMago)"/>
    <!-- Brillo central del orbe -->
    <circle cx="13" cy="13" r="3.5" fill="#ffffff" opacity="0.9"/>
    <!-- Chispas que orbitan -->
    <circle cx="4" cy="10" r="1.2" fill="#00ffff"/>
    <circle cx="28" cy="22" r="1.5" fill="#f1c40f"/>
    <!-- Mano del mago sosteniendo la energía por debajo -->
    <path d="M8 32 Q16 26 24 32" stroke="#d7ccc8" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Marco de la Ventana Gótica -->
  <path d="M22 68 Q22 28 80 28 Q138 28 138 68 L138 178 L22 178 Z" fill="none" stroke="url(#bordeCosmico)" stroke-width="2.5"/>
  <path d="M26 70 Q26 33 80 33 Q134 33 134 70 L134 174 L26 174 Z" fill="none" stroke="#5dade2" stroke-width="1" opacity="0.4"/>

  <!-- Pergamino / Cinta del Nombre Inferior -->
  <g transform="translate(16, 185)" filter="url(#sombraMago)">
    <path d="M0 8 L12 0 L12 24 L0 16 Z" fill="#0a0f26"/>
    <path d="M128 8 L116 0 L116 24 L128 16 Z" fill="#0a0f26"/>
    <rect x="8" y="0" width="112" height="24" rx="3" fill="url(#cintaMago)" stroke="url(#bordeCosmico)" stroke-width="1.5"/>
    <text x="64" y="16" text-anchor="middle" font-family="'Cinzel', 'MedievalSharp', serif" font-weight="900" font-size="9.5" fill="#d2b4de" letter-spacing="1" filter="drop-shadow(0 1px 2px #000)">7 · EL MAGO</text>
  </g>
</svg>
