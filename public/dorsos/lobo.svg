<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 180">
  <defs>
    <radialGradient id="frioNoche" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#142c44"/>
      <stop offset="60%" stop-color="#091827"/>
      <stop offset="100%" stop-color="#02080f"/>
    </radialGradient>
    <linearGradient id="plataValyria" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#cbd5e1"/>
      <stop offset="80%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="loboPlata" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="50%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <radialGradient id="ojoLoboCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </radialGradient>
  </defs>

  <!-- Fondo gélido de Poniente -->
  <rect width="120" height="180" rx="8" fill="url(#frioNoche)"/>

  <!-- Trama de cristales de escarcha / nieve geométrica -->
  <g stroke="#38bdf8" stroke-width="0.5" opacity="0.25">
    <line x1="20" y1="30" x2="40" y2="30"/><line x1="30" y1="20" x2="30" y2="40"/>
    <line x1="80" y1="30" x2="100" y2="30"/><line x1="90" y1="20" x2="90" y2="40"/>
    <line x1="20" y1="150" x2="40" y2="150"/><line x1="30" y1="140" x2="30" y2="160"/>
    <line x1="80" y1="150" x2="100" y2="150"/><line x1="90" y1="140" x2="90" y2="160"/>
  </g>

  <!-- Marco de acero pulido y escarcha -->
  <rect x="5" y="5" width="110" height="170" rx="6" fill="none" stroke="url(#plataValyria)" stroke-width="1.8"/>
  <rect x="8" y="8" width="104" height="164" rx="4" fill="none" stroke="url(#plataValyria)" stroke-width="0.8" stroke-dasharray="3,3" opacity="0.8"/>

  <!-- Esquineras de carámbano -->
  <g fill="url(#plataValyria)">
    <polygon points="6,6 16,6 6,16"/>
    <polygon points="114,6 104,6 114,16"/>
    <polygon points="6,174 16,174 6,164"/>
    <polygon points="114,174 104,174 114,164"/>
  </g>

  <!-- Resplandor ártico central -->
  <circle cx="60" cy="90" r="38" fill="#38bdf8" opacity="0.15">
    <animate attributeName="opacity" values="0.1;0.3;0.1" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- Aro rúnico céltico norteño -->
  <circle cx="60" cy="90" r="32" fill="none" stroke="url(#plataValyria)" stroke-width="1.4"/>
  <circle cx="60" cy="90" r="35" fill="none" stroke="url(#plataValyria)" stroke-width="0.6" stroke-dasharray="2,3"/>

  <!-- ==================== INSIGNIA CENTRAL DEL LOBO HUARGO ==================== -->
  <g fill="url(#loboPlata)" stroke="#334155" stroke-width="0.6">
    <!-- Cabeza y fauces abiertas aullando -->
    <path d="M48 68 C44 74, 40 82, 42 90 C34 94, 26 98, 22 106 C30 106, 38 102, 44 100 C38 106, 36 114, 38 120 C46 114, 52 108, 56 102 C60 110, 68 116, 76 122 C78 112, 74 102, 68 96 C74 94, 82 92, 88 86 C80 84, 72 86, 66 84 C70 78, 72 72, 70 66 C62 68, 56 74, 52 80 C50 74, 49 70, 48 68 Z"/>
    
    <!-- Orejas alerta -->
    <polygon points="48,68 44,58 54,64"/>
    <polygon points="66,66 72,56 72,66"/>

    <!-- Pelaje en punta del cuello -->
    <path d="M56 102 C60 112, 62 124, 60 132 C68 124, 70 114, 68 106 Z" fill="#94a3b8"/>

    <!-- Ojo glacial resplandeciente -->
    <circle cx="54" cy="80" r="2.2" fill="url(#ojoLoboCyan)">
      <animate attributeName="r" values="1.8;2.4;1.8" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="54" cy="80" r="0.8" fill="#ffffff"/>
  </g>
</svg>
