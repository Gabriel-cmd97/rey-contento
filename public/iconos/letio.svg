<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Gradientes de la gema de Letios -->
    <linearGradient id="gemaBrillo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0F2FE"/>
      <stop offset="25%" stop-color="#60A5FA"/>
      <stop offset="60%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1E3A8A"/>
    </linearGradient>
    <linearGradient id="gemaProfunda" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="70%" stop-color="#1D4ED8"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="facetaluz" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#93C5FD" stop-opacity="0.2"/>
    </linearGradient>
    <!-- Gradiente de la corona dorada de engaste -->
    <linearGradient id="coronaOro" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="40%" stop-color="#FBBF24"/>
      <stop offset="75%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#78350F"/>
    </linearGradient>
    <filter id="letioGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Sombra base elíptica -->
  <ellipse cx="64" cy="116" rx="42" ry="7" fill="#0B132B" opacity="0.45"/>

  <!-- Halo de resplandor celestial -->
  <circle cx="64" cy="52" r="38" fill="#38BDF8" opacity="0.2" filter="url(#letioGlow)"/>

  <!-- GEMA FACETADA PRINCIPAL -->
  <g stroke="#0F172A" stroke-width="1.6" stroke-linejoin="round">
    <!-- Base silueta diamante tallado -->
    <polygon points="64,14 102,42 86,88 42,88 26,42" fill="url(#gemaProfunda)"/>

    <!-- Facetas superiores -->
    <polygon points="64,14 44,42 64,48 84,42" fill="url(#gemaBrillo)"/>
    <polygon points="64,14 26,42 44,42" fill="#93C5FD" opacity="0.8"/>
    <polygon points="64,14 84,42 102,42" fill="#1D4ED8" opacity="0.9"/>

    <!-- Faceta central frontal brillante -->
    <polygon points="64,48 44,42 42,88 64,96" fill="#2563EB"/>
    <polygon points="64,48 84,42 86,88 64,96" fill="#1E40AF"/>
    <polygon points="64,48 54,45 52,80 64,88" fill="url(#facetaluz)"/>

    <!-- Facetas laterales inferiores -->
    <polygon points="26,42 44,42 42,88" fill="#60A5FA" opacity="0.85"/>
    <polygon points="102,42 84,42 86,88" fill="#1E3A8A"/>
  </g>

  <!-- Aristas de luz pura (reflejos de cristal) -->
  <line x1="64" y1="14" x2="44" y2="42" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" opacity="0.9"/>
  <line x1="44" y1="42" x2="64" y2="48" stroke="#FFFFFF" stroke-width="1.4" opacity="0.8"/>
  <line x1="64" y1="48" x2="64" y2="94" stroke="#60A5FA" stroke-width="1.5" opacity="0.75"/>

  <!-- CORONA REAL DE ENGASTE (base) -->
  <g fill="url(#coronaOro)" stroke="#78350F" stroke-width="2" stroke-linejoin="round">
    <!-- Banda inferior de la corona con moldura -->
    <rect x="30" y="98" width="68" height="12" rx="3" fill="url(#coronaOro)"/>
    <line x1="33" y1="104" x2="95" y2="104" stroke="#FFFBEB" stroke-width="1.2" opacity="0.7"/>
    <!-- Joyas de la banda inferior -->
    <circle cx="42" cy="104" r="2.5" fill="#EF4444" stroke="#78350F" stroke-width="1"/>
    <circle cx="64" cy="104" r="3.2" fill="#3B82F6" stroke="#78350F" stroke-width="1"/>
    <circle cx="86" cy="104" r="2.5" fill="#10B981" stroke="#78350F" stroke-width="1"/>

    <!-- Puntas ornamentadas de la corona abrazando la gema -->
    <!-- Flor de lis central -->
    <path d="M64 74 C60 82 56 90 56 98 L72 98 C72 90 68 82 64 74 Z"/>
    <circle cx="64" cy="73" r="3.2" fill="#FEF08A" stroke="#78350F" stroke-width="1.2"/>

    <!-- Garra / punta izquierda -->
    <path d="M38 78 C35 85 36 94 38 98 L48 98 C46 93 44 86 46 82 L38 78 Z"/>
    <circle cx="38" cy="78" r="2.8" fill="#FEF08A" stroke="#78350F" stroke-width="1"/>

    <!-- Garra / punta derecha -->
    <path d="M90 78 C93 85 92 94 90 98 L80 98 C82 93 84 86 82 82 L90 78 Z"/>
    <circle cx="90" cy="78" r="2.8" fill="#FEF08A" stroke="#78350F" stroke-width="1"/>
  </g>

  <!-- Destello de diamante superior derecho -->
  <g filter="url(#letioGlow)">
    <path d="M84 20 Q90 22 92 27 Q94 22 100 20 Q94 18 92 13 Q90 18 84 20 Z" fill="#FFFFFF"/>
    <circle cx="92" cy="20" r="2.2" fill="#FFFFFF"/>
  </g>
</svg>
